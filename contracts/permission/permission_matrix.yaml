# role_matrix 为关键操作角色摘要；action_matrix 为派生视图（不重复保存条目）
source: AFS-ARCH-MASTER-V2.0.5 权限矩阵与动作主体
note: role_matrix 为关键操作角色摘要；action_matrix 不再保存 action_key 级副本，统一由 action_registry.yaml 派生（单一事实源）。
