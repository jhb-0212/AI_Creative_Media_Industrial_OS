# 由 AFS-ARCH-MASTER-V2.0.5 C.5 权限矩阵与 31.6 Action Registry 派生
# role_matrix 为关键操作摘要；action_matrix 覆盖全部 action_key
source: AFS-ARCH-MASTER-V2.0.5 权限矩阵与动作主体
note: role_matrix 为关键操作角色摘要；action_matrix 为 80 项 action_key 级完整条目，由 action_registry.yaml 派生，单一事实源不重复维护。
derived_from: action_registry.yaml
role_matrix:
  source_section: C.5 RBAC / ABAC / Capability Token 权限矩阵
  roles:
  - 导演/创作负责人
  - 编剧
  - 技术导演
  - QC 审核人
  - 制片/预算管理员
  - 版权合规
  - Agent/Worker
  actions:
  - action: 提交创意/镜头方案
    grants:
      导演/创作负责人: 允许
      编剧: 允许
      技术导演: 允许
      QC 审核人: 只读建议
      制片/预算管理员: 只读
      版权合规: 只读
      Agent/Worker: Token 范围内提交草案
  - action: 确认 ScriptLock / ShotRevision
    grants:
      导演/创作负责人: 可批准授权范围
      编剧: 可提交/编辑
      技术导演: 技术校验
      QC 审核人: 只读
      制片/预算管理员: 只读
      版权合规: 权利审查意见
      Agent/Worker: 不得自批；只能请求确认
  - action: 修改 CharacterCanon
    grants:
      导演/创作负责人: 提出/批准授权事实
      编剧: 提出/编辑草案
      技术导演: 不得修改事实
      QC 审核人: 不得修改事实
      制片/预算管理员: 不得修改事实
      版权合规: 审查权利来源
      Agent/Worker: 仅创建 Canon Draft
  - action: 锁定 ShotVisualPlan 字段
    grants:
      导演/创作负责人: 批准创作字段
      编剧: 提出建议
      技术导演: 批准技术字段（授权范围）
      QC 审核人: 只读
      制片/预算管理员: 只读
      版权合规: 只读
      Agent/Worker: 不得锁定；可生成建议
  - action: 批准镜头等级/策略变更
    grants:
      导演/创作负责人: 创作/策略审批范围
      编剧: 无
      技术导演: 技术可行性评估
      QC 审核人: 无
      制片/预算管理员: 预算审批/资源确认
      版权合规: 合规审查
      Agent/Worker: 仅提交申请
  - action: 批准质量 Gate
    grants:
      导演/创作负责人: 不得代替 QC
      编剧: 不得
      技术导演: 仅限技术 Gate 职责且职责分离
      QC 审核人: 批准 QC 职责范围
      制片/预算管理员: 不得
      版权合规: 批准合规 Gate 职责范围
      Agent/Worker: 不得通过 Gate
  - action: 预算预留/释放/调拨
    grants:
      导演/创作负责人: 申请或授权范围
      编剧: 无
      技术导演: 可申请技术资源
      QC 审核人: 无
      制片/预算管理员: 审批及账本管理
      版权合规: 无
      Agent/Worker: 仅限已签发 budget_scope
  - action: 版权许可确认/隔离解除
    grants:
      导演/创作负责人: 提供创作来源
      编剧: 提供来源
      技术导演: 提供技术来源
      QC 审核人: 发现并报告
      制片/预算管理员: 无
      版权合规: 唯一权威确认角色
      Agent/Worker: 不得确认或解除隔离
  - action: 系统配置/密钥/策略发布
    grants:
      导演/创作负责人: 无
      编剧: 无
      技术导演: 按运维授权
      QC 审核人: 无
      制片/预算管理员: 无
      版权合规: 审计参与
      Agent/Worker: Worker 最小权限；系统管理员操作全审计
action_matrix:
  source_section: 31.6 Action Registry 唯一注册表
  total: 80
  actions:
  - action_key: PROJECT.CREATE
    resource_type: Project
    scope: tenant+organization
    risk_level: MEDIUM
    token_required: true
    allowed_principals: 项目管理员/制片
    approval_requirement: 成员资格与配额校验，无自批权限。
    audit_event: PROJECT_CREATED
    negative_test_id: ACT-PROJ-NEG-001
    status: ACTIVE
  - action_key: EPISODE.CREATE
    resource_type: Episode
    scope: project
    risk_level: MEDIUM
    token_required: true
    allowed_principals: 导演/编剧/制片
    approval_requirement: Episode 必须归属已存在 Project（复合归属校验），杜绝悬空引用。
    audit_event: EPISODE_CREATED
    negative_test_id: ACT-EPISODE-NEG-001
    status: ACTIVE
  - action_key: SCRIPT.IMPORT
    resource_type: ScriptRevision
    scope: project/episode
    risk_level: MEDIUM
    token_required: true
    allowed_principals: 导演/编剧/制片
    approval_requirement: 检查项目写权限、文件安全与导入来源。
    audit_event: SCRIPT_IMPORTED
    negative_test_id: ACT-SCRIPT-NEG-001
    status: ACTIVE
  - action_key: SCRIPT.LOCK.REQUEST
    resource_type: ScriptLock
    scope: project/episode
    risk_level: MEDIUM
    token_required: true
    allowed_principals: 导演/编剧
    approval_requirement: 仅提交锁定申请（DRAFT→LOCK_PENDING）；申请人与批准人职责分离。
    audit_event: SCRIPT_LOCK_REQUESTED
    negative_test_id: ACT-SCRIPT-NEG-003
    status: ACTIVE
  - action_key: SCRIPT.LOCK.APPROVE
    resource_type: ScriptLock
    scope: project/episode
    risk_level: HIGH
    token_required: true
    allowed_principals: 导演/授权编剧
    approval_requirement: 人工确认，申请人与批准职责分离。
    audit_event: SCRIPT_LOCK_APPROVED
    negative_test_id: ACT-SCRIPT-NEG-002
    status: ACTIVE
  - action_key: SHOT.DRAFT.CREATE
    resource_type: ShotDraft
    scope: project/episode/scene
    risk_level: LOW
    token_required: true
    allowed_principals: Agent/编剧/导演
    approval_requirement: Agent 仅生成 DRAFT，不写正式 ShotRevision。
    audit_event: SHOT_DRAFT_CREATED
    negative_test_id: ACT-SHOT-NEG-001
    status: ACTIVE
  - action_key: SHOT.REVISION.CONFIRM
    resource_type: ShotRevision
    scope: project/episode/scene/shot
    risk_level: HIGH
    token_required: true
    allowed_principals: 导演/镜头负责人
    approval_requirement: 人类确认，版本冲突必须拒绝。
    audit_event: SHOT_REVISION_CONFIRMED
    negative_test_id: ACT-SHOT-NEG-002
    status: ACTIVE
  - action_key: SHOTSPEC.LOCK
    resource_type: ShotSpec
    scope: project/shot
    risk_level: HIGH
    token_required: true
    allowed_principals: 导演/授权 TD
    approval_requirement: 锁定维度、依据、版本和审批事件齐备。
    audit_event: SHOTSPEC_LOCKED
    negative_test_id: ACT-SPEC-NEG-001
    status: ACTIVE
  - action_key: CONSTRAINT.PACK.CREATE
    resource_type: ConstraintPack
    scope: project/shot
    risk_level: MEDIUM
    token_required: true
    allowed_principals: Agent/TD/导演
    approval_requirement: Agent 仅能创建 DRAFT；无锁定约束标记 NOT_APPLICABLE。
    audit_event: CONSTRAINT_PACK_CREATED
    negative_test_id: ACT-CNST-NEG-001
    status: ACTIVE
  - action_key: CONSTRAINT.PACK.LOCK
    resource_type: ConstraintPack
    scope: project/shot
    risk_level: HIGH
    token_required: true
    allowed_principals: 导演/授权 TD
    approval_requirement: 仅锁定经批准的 BASELINE 维度；审批与版本固定。
    audit_event: CONSTRAINT_PACK_LOCKED
    negative_test_id: ACT-CNST-NEG-002
    status: ACTIVE
  - action_key: PRODUCTION.ROUTE.SELECT
    resource_type: ProductionRoute
    scope: project/shot/task
    risk_level: MEDIUM
    token_required: true
    allowed_principals: 制片/TD/授权调度器
    approval_requirement: 路线须处于 VERIFIED 且满足 rights/capability。
    audit_event: PRODUCTION_ROUTE_SELECTED
    negative_test_id: ACT-ROUTE-NEG-001
    status: ACTIVE
  - action_key: GENERATION.REQUEST
    resource_type: GenerationTask
    scope: project/shot
    risk_level: MEDIUM
    token_required: true
    allowed_principals: 导演/制片/Agent（授权范围内）
    approval_requirement: 预算、配额、依赖与约束快照通过。
    audit_event: GENERATION_REQUESTED
    negative_test_id: ACT-GEN-NEG-001
    status: ACTIVE
  - action_key: ASSET.VERSION.CREATE
    resource_type: AssetVersion
    scope: project/shot/asset
    risk_level: MEDIUM
    token_required: true
    allowed_principals: Worker/Model Adapter
    approval_requirement: 仅新增不可变版本，不覆盖旧版本或改变 GOLD。
    audit_event: ASSET_VERSION_CREATED
    negative_test_id: ACT-ASSET-NEG-001
    status: ACTIVE
  - action_key: ASSET.VERSION.APPROVE
    resource_type: AssetVersion
    scope: project/shot/asset
    risk_level: HIGH
    token_required: true
    allowed_principals: 授权审核人/QC/导演按职责
    approval_requirement: 权利、QC 和证据通过。
    audit_event: ASSET_VERSION_APPROVED
    negative_test_id: ACT-ASSET-NEG-002
    status: ACTIVE
  - action_key: QC.REPORT.CREATE
    resource_type: QCReport
    scope: project/shot/asset_version
    risk_level: MEDIUM
    token_required: true
    allowed_principals: QC Worker/受信检测服务
    approval_requirement: 只写检测结果与证据，不改变 Gate。
    audit_event: QC_REPORT_CREATED
    negative_test_id: ACT-QC-NEG-001
    status: ACTIVE
  - action_key: PRODUCTION.GATE.APPROVE
    resource_type: GateDecision
    scope: project/shot/delivery
    risk_level: CRITICAL
    token_required: true
    allowed_principals: 对应 Gate 授权人类职责主体
    approval_requirement: 强制角色分离、证据与审批记录。
    audit_event: PRODUCTION_GATE_APPROVED
    negative_test_id: ACT-GATE-NEG-001
    status: ACTIVE
  - action_key: CANON.CHANGE.APPROVE
    resource_type: CharacterCanon/CanonRevision
    scope: project/character
    risk_level: CRITICAL
    token_required: true
    allowed_principals: 导演/Canon Owner
    approval_requirement: 变更理由、影响范围、版本和回滚关系齐备。
    audit_event: CANON_CHANGE_APPROVED
    negative_test_id: ACT-CANON-NEG-001
    status: ACTIVE
  - action_key: RIGHTS.STATUS.CHANGE
    resource_type: RightsCase/RightsManifest
    scope: tenant/project/asset
    risk_level: CRITICAL
    token_required: true
    allowed_principals: 版权/法务授权人
    approval_requirement: 双人或职责分离审批；权利证据必须可追溯。
    audit_event: RIGHTS_STATUS_CHANGED
    negative_test_id: ACT-RIGHTS-NEG-001
    status: ACTIVE
  - action_key: BUDGET.SHOT.REQUEST
    resource_type: ShotBudgetRequest
    scope: project/shot/account
    risk_level: MEDIUM
    token_required: true
    allowed_principals: 项目成员/Agent 可提交草案
    approval_requirement: 必须指定账户、用途、成本类别和上限。
    audit_event: SHOT_BUDGET_REQUESTED
    negative_test_id: ACT-BUDGET-NEG-001
    status: ACTIVE
  - action_key: BUDGET.SHOT.APPROVE
    resource_type: ShotBudgetRequest/BudgetLedger
    scope: project/account
    risk_level: HIGH
    token_required: true
    allowed_principals: 预算管理员/制片
    approval_requirement: 申请人与审批人分离；不得改变 QualityReserve 用途。
    audit_event: SHOT_BUDGET_APPROVED
    negative_test_id: ACT-BUDGET-NEG-002
    status: ACTIVE
  - action_key: BUDGET.TRANSFER.REQUEST
    resource_type: BudgetTransferRequest
    scope: tenant/project/accounts
    risk_level: HIGH
    token_required: true
    allowed_principals: 预算管理员/制片提交
    approval_requirement: Phase 1 仅登记/不执行跨账户转拨。
    audit_event: BUDGET_TRANSFER_REQUESTED
    negative_test_id: ACT-TRANSFER-NEG-001
    status: PHASE_GATED（Phase 2+）
  - action_key: BUDGET.TRANSFER.APPROVE
    resource_type: BudgetTransferRequest/BudgetLedger
    scope: tenant/project/accounts
    risk_level: CRITICAL
    token_required: true
    allowed_principals: 双人职责分离的预算审批人
    approval_requirement: 原子记账与幂等校验。
    audit_event: BUDGET_TRANSFER_APPROVED
    negative_test_id: ACT-TRANSFER-NEG-002
    status: PHASE_GATED（Phase 2+）
  - action_key: SHOWCASE.SNAPSHOT.CREATE
    resource_type: ShowcaseSnapshot
    scope: project/shot/asset_version
    risk_level: MEDIUM
    token_required: true
    allowed_principals: 项目成员/Agent
    approval_requirement: Agent 仅创建 DRAFT，引用必须精确且可见。
    audit_event: SHOWCASE_SNAPSHOT_CREATED
    negative_test_id: ACT-SHOWCASE-NEG-001
    status: ACTIVE
  - action_key: SHOWCASE.SNAPSHOT.REVOKE
    resource_type: ShowcaseSnapshot
    scope: snapshot/audience
    risk_level: HIGH
    token_required: true
    allowed_principals: 版权/安全/组织授权人
    approval_requirement: 记录原因、范围、证据和影响快照。
    audit_event: SHOWCASE_SNAPSHOT_REVOKED
    negative_test_id: ACT-SHOWCASE-NEG-002
    status: ACTIVE
  - action_key: SHOWCASE.SHARE.CREATE
    resource_type: ShareLink
    scope: snapshot/audience
    risk_level: MEDIUM
    token_required: true
    allowed_principals: 导演/制片/项目管理员
    approval_requirement: 只读、下载默认关闭、有效期/水印/受众必填。
    audit_event: SHARE_LINK_CREATED
    negative_test_id: ACT-SHARE-NEG-001
    status: ACTIVE
  - action_key: SHOWCASE.SHARE.REVOKE
    resource_type: ShareLink
    scope: share_link/audience
    risk_level: HIGH
    token_required: true
    allowed_principals: 链接创建授权人/组织管理员/版权安全人员
    approval_requirement: 撤销理由留痕。
    audit_event: SHARE_LINK_REVOKED
    negative_test_id: ACT-SHARE-NEG-002
    status: ACTIVE
  - action_key: COMMUNITY.POST.SUBMIT
    resource_type: CommunityPost
    scope: organization/post
    risk_level: MEDIUM
    token_required: true
    allowed_principals: 作者/内容权利人
    approval_requirement: 绑定有效快照、内容类型、受众和权利证据。
    audit_event: COMMUNITY_POST_SUBMITTED
    negative_test_id: ACT-COMM-NEG-001
    status: PHASE_GATED（Phase 2）
  - action_key: COMMUNITY.POST.APPROVE
    resource_type: PublicationReview
    scope: organization/post
    risk_level: HIGH
    token_required: true
    allowed_principals: 组织审核员/版主
    approval_requirement: 提交人与审批人分离，证据审查并留决定。
    audit_event: COMMUNITY_POST_APPROVED
    negative_test_id: ACT-COMM-NEG-002
    status: PHASE_GATED（Phase 2）
  - action_key: COMMUNITY.POST.PUBLISH.ORG
    resource_type: CommunityPost
    scope: organization/post
    risk_level: HIGH
    token_required: true
    allowed_principals: 组织授权发布人
    approval_requirement: PG0—PG3 通过并核验组织受众。
    audit_event: COMMUNITY_POST_PUBLISHED_ORG
    negative_test_id: ACT-COMM-NEG-003
    status: PHASE_GATED（Phase 2）
  - action_key: COMMUNITY.POST.PUBLISH.PUBLIC
    resource_type: CommunityPost
    scope: public/post
    risk_level: CRITICAL
    token_required: true
    allowed_principals: 平台版主/公开发布授权人
    approval_requirement: PG0—PG3 完整通过，权利范围含公开传播。
    audit_event: COMMUNITY_POST_PUBLISHED_PUBLIC
    negative_test_id: ACT-COMM-NEG-004
    status: PHASE_GATED（Phase 3）
  - action_key: COMMUNITY.POST.UNLIST
    resource_type: CommunityPost
    scope: organization/public/post
    risk_level: MEDIUM
    token_required: true
    allowed_principals: 作者/组织管理员/版主
    approval_requirement: 记录原因、受众、影响和通知。
    audit_event: COMMUNITY_POST_UNLISTED
    negative_test_id: ACT-COMM-NEG-005
    status: PHASE_GATED（Phase 2）
  - action_key: COMMUNITY.POST.TAKEDOWN
    resource_type: CommunityPost
    scope: organization/public/post
    risk_level: HIGH
    token_required: true
    allowed_principals: 版主/版权/安全授权人
    approval_requirement: 依据、范围、通知和证据必填。
    audit_event: COMMUNITY_POST_TAKEN_DOWN
    negative_test_id: ACT-COMM-NEG-006
    status: PHASE_GATED（Phase 2）
  - action_key: COMMUNITY.COMMENT.CREATE
    resource_type: CommunityComment
    scope: organization/post/comment
    risk_level: LOW
    token_required: true
    allowed_principals: 在帖子受众范围内的登录用户/获邀访客
    approval_requirement: 评论开关、内容安全、速率限制和帖子状态校验。
    audit_event: COMMUNITY_COMMENT_CREATED
    negative_test_id: ACT-COMMENT-NEG-001
    status: PHASE_GATED（Phase 2）
  - action_key: COMMUNITY.FAVORITE.CREATE
    resource_type: Favorite
    scope: organization/post/user
    risk_level: LOW
    token_required: true
    allowed_principals: 在帖子受众范围内的登录用户
    approval_requirement: 校验可见性、账号状态和幂等唯一键。
    audit_event: COMMUNITY_FAVORITE_CREATED
    negative_test_id: ACT-FAVORITE-NEG-001
    status: PHASE_GATED（Phase 2）
  - action_key: COMMUNITY.FAVORITE.REMOVE
    resource_type: Favorite
    scope: organization/post/user
    risk_level: LOW
    token_required: true
    allowed_principals: 收藏关系所属用户
    approval_requirement: 只能移除本人收藏，要求幂等。
    audit_event: COMMUNITY_FAVORITE_REMOVED
    negative_test_id: ACT-FAVORITE-NEG-002
    status: PHASE_GATED（Phase 2）
  - action_key: COMMUNITY.REPORT.CREATE
    resource_type: CommunityReport
    scope: post/comment/user
    risk_level: LOW
    token_required: true
    allowed_principals: 可见范围内用户
    approval_requirement: 举报不自动构成事实裁决。
    audit_event: COMMUNITY_REPORT_CREATED
    negative_test_id: ACT-COMM-NEG-007
    status: PHASE_GATED（Phase 2）
  - action_key: COMMUNITY.REPORT.HANDLE
    resource_type: ModerationCase
    scope: post/comment/user
    risk_level: HIGH
    token_required: true
    allowed_principals: 版主/版权/安全人员
    approval_requirement: 独立调查、证据、处理时限与通知。
    audit_event: COMMUNITY_REPORT_HANDLED
    negative_test_id: ACT-COMM-NEG-008
    status: PHASE_GATED（Phase 2）
  - action_key: COMMUNITY.APPEAL.SUBMIT
    resource_type: Appeal
    scope: takedown/post
    risk_level: MEDIUM
    token_required: true
    allowed_principals: 作者/权利主体
    approval_requirement: 须引用原处置与申诉理由/证据。
    audit_event: COMMUNITY_APPEAL_SUBMITTED
    negative_test_id: ACT-APPEAL-NEG-001
    status: PHASE_GATED（Phase 2）
  - action_key: COMMUNITY.APPEAL.REVIEW
    resource_type: Appeal
    scope: takedown/post
    risk_level: HIGH
    token_required: true
    allowed_principals: 独立复核人
    approval_requirement: 必须与原处置人分离，决定码固定。
    audit_event: COMMUNITY_APPEAL_DECIDED
    negative_test_id: ACT-APPEAL-NEG-002
    status: PHASE_GATED（Phase 2）
  - action_key: COMMUNITY.REUSE.REQUEST
    resource_type: ReuseRequest
    scope: source_snapshot/target_project
    risk_level: MEDIUM
    token_required: true
    allowed_principals: 申请人
    approval_requirement: 只可申请明确资产/信息/用途范围。
    audit_event: COMMUNITY_REUSE_REQUESTED
    negative_test_id: ACT-REUSE-NEG-001
    status: ACTIVE（Phase 1 人工申请）
  - action_key: COMMUNITY.REUSE.APPROVE
    resource_type: ReuseRequest
    scope: source_asset/target_project
    risk_level: CRITICAL
    token_required: true
