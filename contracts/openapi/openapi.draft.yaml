components:
  schemas:
    ActionRequestEnvelope:
      type: object
      required:
      - actor_ref
      - idempotency_key
      properties:
        actor_ref:
          type: string
          description: 调用主体引用
        capability_token:
          type: string
          description: token_required=true 时必填的最小权限凭据
        idempotency_key:
          type: string
          description: 幂等键；重复提交必须返回同一结果
        payload:
          type: object
          description: 具体 Action 载荷，Phase 1 按对象契约定义
      additionalProperties: true
    ActionAccepted:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ACCEPTED
          - REJECTED
          - PHASE_NOT_ENABLED
        audit_event:
          type: string
        audit_ref:
          type: string
        idempotency_key:
          type: string
      additionalProperties: true
