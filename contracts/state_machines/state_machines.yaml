  authoritative_source: 预算章节「跨账户转拨保留 BudgetTransferRequest，须人工申请、人工审批、原子记账校验，Phase 2+」
  allowed_states: [APPROVED, DRAFT, EXECUTED, EXECUTING, FAILED, IN_REVIEW, REJECTED, SUBMITTED]
  transitions: []
  note: >-
    反向补登：该对象在此前只有 object_schemas 里的 status.enum，state_machines 从未登记——形成「Schema 有状态、权威集合里没有」的孤儿枚举。
    allowed_states 取自既有 schema 枚举值（保持既有契约不扩大也不缩小），但正文只写了「人工申请 → 人工审批 → 原子记账」，未给出转移边，
    因此 transitions 刻意留空：Phase 2 启用前不得推定边，未登记转移一律拒绝（31.5）。启用前须由所有者复核状态集与转移边后固化。
  source_kind: schema_enum_reverse_registered
  registration_status: PENDING_PHASE2_REVIEW
  all_sources:
