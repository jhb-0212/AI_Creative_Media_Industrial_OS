  - {from: CHANGES_REQUESTED, to: CLOSED}
  - {from: COMMENTED, to: APPROVED}
  - {from: COMMENTED, to: CHANGES_REQUESTED}
  - {from: DRAFT, to: SENT}
  - {from: IN_REVIEW, to: COMMENTED}
  - {from: SENT, to: IN_REVIEW}
  note: >-
    客户审片门户实例的生命周期；ClientAnnotation 为其下挂批注对象，不是独立领域对象。客户批准只代表业务审阅结论，不得直接改变 ShotRevision、PictureLock、
