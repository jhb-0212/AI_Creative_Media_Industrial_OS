  authority: C.7 关键状态机与版本不可变规则
  ruling: RESOLVED 之后必须先经 GATE_ELIGIBLE 才可到 CLOSED；禁止 RESOLVED→CLOSED 跳关，跳过 Gate 资格校验等同绕过 Gate 门禁，一律拒绝。
- object: PatternRecord
  ruled_by: AFS-P0-FREEZE-2026-11-13-01
  authority: C.3 对象总表（PatternRecord 行）
  ruling: 以 C.3 为准：EXPERIMENT_RECORD→IN_REVIEW→REUSABLE_PATTERN/REJECTED/FAILURE_CASE，REUSABLE_PATTERN→DEPRECATED→RETIRED。26.2 的 REJECTED_PROPOSAL 与 REJECTED 同义，按 C.3 记 REJECTED；26.2 未列 DEPRECATED、RETIRED 属描述省略，不构成第二套状态集。26.2
    的晋升条件（质量证据、版权审查、适用边界说明、责任人审批）为准入规则，与状态转移并行适用。
