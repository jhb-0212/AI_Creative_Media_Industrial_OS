  all_sources:
  - C.3 新增领域对象的数据契约与所有权
  - C.7 关键状态机与版本不可变规则

- object: CharacterCard
  authoritative_source: C.7 关键状态机与版本不可变规则
  allowed_states: [ACTIVE, APPROVED, DRAFT, IN_REVIEW, QUARANTINED, REJECTED, REVOKED, SUPERSEDED]
  transitions:
  - {from: ACTIVE, to: SUPERSEDED}
  - {from: APPROVED, to: ACTIVE}
  - {from: DRAFT, to: IN_REVIEW}
  - {from: IN_REVIEW, to: APPROVED}
  note: 批准后版本不可覆盖；变更创建新版本；Rights 不合格进入 QUARANTINED
  conflict: true
  conflict_kind: state_set_diff
  other_definitions:
  - source_section: C.3 新增领域对象的数据契约与所有权
    states_text: DRAFT→IN_REVIEW→APPROVED→ACTIVE→SUPERSEDED/REVOKED
    kind: state_set_diff
    ruling: C.3 未列 REJECTED / QUARANTINED 属描述省略（C.7 为权威），与 CharacterCanon / ShotVisualPlan 同一裁决口径；不构成第二套状态集。
  all_sources:
  - C.7 关键状态机与版本不可变规则

- object: CharacterAppearance
  authoritative_source: C.7 关键状态机与版本不可变规则
  allowed_states: [ACTIVE, APPROVED, DRAFT, IN_REVIEW, QUARANTINED, REJECTED, REVOKED, SUPERSEDED]
  transitions:
  - {from: ACTIVE, to: SUPERSEDED}
  - {from: APPROVED, to: ACTIVE}
  - {from: DRAFT, to: IN_REVIEW}
  - {from: IN_REVIEW, to: APPROVED}
  note: >-
    与 CharacterCard 共享同一组状态（C.7 原文以「CharacterCard / CharacterAppearance」一条登记两个对象）：两者同为角色域版本化对象，
    批准后版本不可覆盖，变更创建新版本，Rights 不合格进入 QUARANTINED。共享状态集是刻意选择——同一生命周期两种命名，实现方要为角色域学习两套判定，且跨对象校验无法复用。
  all_sources:
  - C.7 关键状态机与版本不可变规则

- object: ClientReviewPortal
  authoritative_source: 27.2 客户审片状态机与意见处理
  allowed_states: [APPROVED, CHANGES_REQUESTED, CLOSED, COMMENTED, DRAFT, IN_REVIEW, SENT]
  transitions:
