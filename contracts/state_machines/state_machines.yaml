- object: Project
  authoritative_source: 8.1 核心实体（项目层级聚合根，主链实现补登）
  allowed_states: [ACTIVE, ARCHIVED, COMPLETED, DRAFT, ON_HOLD]
  transitions:
  - {from: ACTIVE, to: COMPLETED}
  - {from: ACTIVE, to: ON_HOLD}
  - {from: COMPLETED, to: ARCHIVED}
  - {from: DRAFT, to: ACTIVE}
  - {from: DRAFT, to: ARCHIVED}
  - {from: ON_HOLD, to: ACTIVE}
  - {from: ON_HOLD, to: ARCHIVED}
