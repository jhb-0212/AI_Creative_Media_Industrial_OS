- object: CharacterCanon
  authoritative_source: C.7 关键状态机与版本不可变规则
  allowed_states: [ACTIVE, APPROVED, CONFLICT_REVIEW, DRAFT, IN_REVIEW, SUPERSEDED]
  transitions:
