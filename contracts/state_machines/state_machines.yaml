  source_kind: paragraph_state_machine
  all_sources:
  - 27.2 客户审片状态机与意见处理

- object: CommunityPost
  authoritative_source: 31.5 社区对象状态机最终定义
  allowed_states: [APPROVED, ARCHIVED, DRAFT, PENDING_REVIEW, PUBLISHED, SUBMITTED, TAKEN_DOWN, UNLISTED]
  transitions:
  - {from: APPROVED, to: PUBLISHED}
  - {from: DRAFT, to: SUBMITTED}
  - {from: PENDING_REVIEW, to: APPROVED}
  - {from: SUBMITTED, to: PENDING_REVIEW}
  - {from: PUBLISHED, to: UNLISTED}
  - {from: PUBLISHED, to: TAKEN_DOWN}
  - {from: PUBLISHED, to: ARCHIVED}
  note: >-
    PUBLISHED 必须校验并引用 PG0—PG3 全部通过的 PublicationReview/PublicationGate 决定；Phase 1 不开放公开审核发布。
    31.5 原文「发布后可 UNLISTED / TAKEN_DOWN / ARCHIVED」明确授权三条发布后治理边，v2 结构化迁移时漏抄，本轮补齐。
    TAKEN_DOWN / ARCHIVED / UNLISTED 为治理终态，不得原地恢复；恢复须新建 post 并重走 Publication Review。
  all_sources:
  - 24.11 社区状态机、分享链接与复用状态机
  - 31.5 社区对象状态机最终定义

- object: ConstraintPack
  authoritative_source: 7.9 隐式连续性依赖登记
  allowed_states: [ACTIVE, DRAFT, REVOKED, STALE, SUPERSEDED]
  initial_state: DRAFT
  transitions:
  - {from: ACTIVE, to: REVOKED}
  - {from: ACTIVE, to: STALE}
  - {from: ACTIVE, to: SUPERSEDED}
  - {from: DRAFT, to: ACTIVE}
  # 约束包是叶子对象：约束条目是包内 JSON 数组（7.9 的 object[]），不是独立对象，
  # 没有子对象挂在其下。
  frozen_states: []
  note: >-
    只有 ACTIVE 可作为生成输入；NOT_APPLICABLE 包同样须经 ACTIVE，以证明「无锁定约束」是
    授权人判断而非默认值；REVOKED 立即阻断相关路线。四条边分属两个动作：DRAFT→ACTIVE 归
    CONSTRAINT.PACK.LOCK（锁定义务），ACTIVE→STALE/SUPERSEDED/REVOKED 归
    CONSTRAINT.PACK.STATUS.CHANGE（治理结论）。共用一个入口会让「锁一份新包」与「撤销一份
    已生效的包」成为同一种通行证。三条治理边当前无运行时入口，逐边债务见
    contracts/runtime/state_machine_gaps.yaml。
  source_kind: field_contract_status
  registration_status: PENDING_PHASE1_REVIEW
  all_sources:
  - 7.9 隐式连续性依赖登记

