  transitions:
  - {from: DRAFT, to: VALIDATING}
  - {from: VALIDATING, to: VALIDATED}
  note: 不包含 PUBLISHED——发布状态属于 CreatorRelease，不得混写；必须引用外部渲染回流产生的新 AssetVersion，不声明 Gate4 PASS。
  source_kind: table_conflict_row
  all_sources:
  - 34.7 CreatorDeliveryManifest 与 CREATOR_RELEASE 定义

- object: CreatorGate
