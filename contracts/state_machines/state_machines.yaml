  - {from: BLOCKED, to: NOT_STARTED}
  - {from: IN_PRODUCTION, to: BLOCKED}
  - {from: IN_PRODUCTION, to: CANCELLED}
  - {from: IN_PRODUCTION, to: PRODUCTION_COMPLETE}
  - {from: NOT_STARTED, to: BLOCKED}
  - {from: NOT_STARTED, to: CANCELLED}
  - {from: NOT_STARTED, to: IN_PRODUCTION}
  - {from: PRODUCTION_COMPLETE, to: IN_PRODUCTION}
  guards:
  - transition: {from: NOT_STARTED, to: BLOCKED}
    fields: [blocked_reason]
    rule: 进入 BLOCKED 必须写明可追溯的阻塞原因；无原因的阻塞等于不可诊断
  - transition: {from: IN_PRODUCTION, to: BLOCKED}
    fields: [blocked_reason]
    rule: 同上：生产中阻塞同样必须留下原因，否则无法判断是资源、权利还是质量阻塞
  - transition: {from: PRODUCTION_COMPLETE, to: IN_PRODUCTION}
    fields: [rework_basis_ref]
    rule: 必须有正式返工依据（ReworkTask 授权记录）；无依据的回退是绕过验收的暗门，一律拒绝
  - transition: {from: NOT_STARTED, to: CANCELLED}
    fields: [cancellation_ref, cancelled_at]
    rule: 移出生产范围必须携带授权记录与取消时间；只写终态等于无据取消
  - transition: {from: IN_PRODUCTION, to: CANCELLED}
    fields: [cancellation_ref, cancelled_at]
    rule: 同上：生产中取消同属授权行为，不得由执行方自行置终态
  - transition: {from: BLOCKED, to: CANCELLED}
    fields: [cancellation_ref, cancelled_at]
    rule: 同上：阻塞导致的取消仍须有授权记录，不能把「卡住了」直接变成「不做了」
  # 刻意留空：Shot 不是「建完就封存」的容器——返工任务必须在 PRODUCTION_COMPLETE
  # 之后仍能创建（rework_basis_ref 指向该状态下的回退依据）。若在这里冻结，
  # 合法返工流程会被挡在门外。这个判断若变化，必须改契约（而不是改代码）。
  frozen_states: []
  note: >-
    正文从未给出 Shot 的完整状态集，唯一出现的 status: IN_PRODUCTION 只是 8.3 的示例值， 不是枚举；以下五态是项目所有者 2026-11-18 明确给出的新增设计决策，
