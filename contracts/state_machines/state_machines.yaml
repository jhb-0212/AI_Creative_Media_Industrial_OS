  - from: ACTIVE
    to: SUPERSEDED
  - from: ACTIVE
    to: REVOKED
  frozen_states: [REVOKED, SUPERSEDED]
  note: >-
    单条约束与 ConstraintPack 包级状态集的关系是「包级五值 + 待确认前置态」，不是两套命名。
    8.10 明确「观察到的状态和模型推断先进入待确认队列，只有经批准的 Canon/Constraint
    才能形成硬性阻断」，所以 DRAFT 不得直达 ACTIVE：观察/推断必须先落 PENDING_CONFIRMATION，
    经 approval_ref 指向的授权人批准后才可以 ACTIVE 作为硬约束参与阻断。ACTIVE 之后的三条
    治理边沿用包级 7.9 语义（STALE 引用失效、SUPERSEDED 换版、REVOKED 授权撤销）。
