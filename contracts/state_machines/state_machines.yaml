- object: CreatorRelease
  authoritative_source: 34.8 分享、社区发布与公开权限
  allowed_states: [ARCHIVED, AUTO_CHECKING, BLOCKED, DRAFT, HELD_FOR_REVIEW, PUBLISHED, PUBLISH_REQUESTED, REVOKED, TAKEN_DOWN, UNLISTED]
  transitions:
  - {from: AUTO_CHECKING, to: BLOCKED}
  - {from: AUTO_CHECKING, to: HELD_FOR_REVIEW}
  - {from: AUTO_CHECKING, to: PUBLISHED}
  - {from: DRAFT, to: PUBLISH_REQUESTED}
  - {from: PUBLISH_REQUESTED, to: AUTO_CHECKING}
  - {from: PUBLISHED, to: UNLISTED}
  - {from: PUBLISHED, to: TAKEN_DOWN}
  - {from: PUBLISHED, to: REVOKED}
  - {from: PUBLISHED, to: ARCHIVED}
  note: >-
    发布必须由 CreatorWorkspace 所有者/权利主体本人显式点击；低风险且权利明确、自动检查 PASSED 时可直接发布，不要求前置人工内容审核；
