    写进 Shot 就是第二份审核事实）；不设 REWORK（返工归 ReworkTask， 获准返工后 Shot 回到 IN_PRODUCTION 并保留 rework_basis_ref）；
    不设 DELIVERED （PRODUCTION_COMPLETE 只表示要求的生产产物已完成，Gate 3 / Gate 4 结论归 GateInstance 与 PictureLock Snaps
    hot / DeliveryPackage，避免出现「声称已交付、 却拿不出 Gate 4 证据」的状态）。CANCELLED 为终态，恢复必须新建 Shot 并重新授权。
