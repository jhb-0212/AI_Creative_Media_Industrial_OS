  - {from: APPROVED, to: ACTIVE}
  - {from: DRAFT, to: IN_REVIEW}
  - {from: IN_REVIEW, to: APPROVED}
  note: Canon 事实只由授权人确认；冲突期间相关镜头不得自动合并事实
