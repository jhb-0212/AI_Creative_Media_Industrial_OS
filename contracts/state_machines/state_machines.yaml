# 状态机契约（v2：允许状态集合与转移图分离）
#
# 为什么要把 allowed_states 与 transitions 分开
# ------------------------------------------
# v1 用一条自由文本状态链（states: DRAFT→ACTIVE→...）同时表达两件事，结果是
# 状态集合只能靠正则从文本里抠：旁支状态（AssetVersion 的 QUARANTINED、Task 的
# WAITING_FOR_PROVIDER）没有登记来源边就永远抠不出来，而 `A→B / C` 的斜杠在
# 源侧表示「多个源」、在目标侧表示「多个目标」，同一个字符两种语义——解析器
# 只能猜。enum_registry 曾因此被机械抓取正文关键词污染（PG0 / PG3 / PMS / PASS
# 都当过「状态值」）。
#
# v2 的口径：
#   allowed_states —— 该对象允许出现的全部状态值（唯一权威集合，Schema 的
#                     status.enum 与 contracts/enums/enum_registry.yaml 都由它派生）；
#   transitions    —— 已授权的状态转移边（只含正文明确给出的边，未登记一律拒绝，
#                     31.5）。允许状态可以没有入边：那是「合法但当前无授权入口」的
#                     旁支，不是遗漏。
#   guards         —— 特定转移必须携带的证据字段。
#   frozen_states  —— 处于这些状态时，其下不得再新增子对象（「这一支不再长了」）。
#                     这是关于**状态**的性质，不是关于某个动作的性质：写成四个
#                     调用点 if 时，漏掉的那条不会让任何闸门变红。可以没有子对象
#                     的对象（如 ShotRevision）也必须显式写 [] ——「没有声明」与
#                     「声明为空」在运行期同形，只有显式才能被判据区分。
#                     不得由终态推导：Project.COMPLETED 仍有出边（→ARCHIVED），
#                     却是冻结态；终态与冻结态是交叉关系。
#
# allowed_states 按字母序书写：它是集合不是序列，顺序不承载语义；字母序让
# 手工增删与 diff 稳定，也避免「两份文件顺序不同」被误判为契约漂移。
#
version: 2
source: AFS-ARCH-MASTER-V2.0.5 各章节状态机定义（由 Markdown 基线派生）
authority_rule: 同一对象多处定义时，按 31.5 唯一权威状态机 > 32.6/C.7 > 34.x > 33.3 > C.3 取权威；24.11 为摘要不计入权威；差异不静默合并，见 conflict 字段。
total_objects: 54
conflict_count: 6
object_count_note: total_objects 只计持久化领域对象；UI 投影见 projections 分区（不计入对象数，也不得进枚举注册表）。

conflict_rulings:
- object: CharacterCanon
  ruled_by: AFS-P0-FREEZE-2026-11-13-01
  authority: C.7 关键状态机与版本不可变规则
  ruling: CONFLICT_REVIEW 为合法状态；事实冲突未裁决前相关镜头不得自动合并。C.3 未列该状态属描述省略，不构成第二套状态集。

- object: ShotVisualPlan
  ruled_by: AFS-P0-FREEZE-2026-11-13-01
  authority: C.7 关键状态机与版本不可变规则
  ruling: PARTIALLY_LOCKED、LOCKED 为合法状态，须记录锁定人/时间/理由/版本；C.3 的 DRAFT→REVIEW→APPROVED/REJECTED 为其子集。

- object: ExplorationBranch
  ruled_by: AFS-P0-FREEZE-2026-11-13-01
  authority: C.7 关键状态机与版本不可变规则
  ruling: FAILED 为合法终态，生成失败不得并入 REJECTED：REJECTED 指候选被否，FAILED 指分支执行失败，语义不同。

- object: QCReviewSession
  ruled_by: AFS-P0-FREEZE-2026-11-13-01
  authority: C.7 关键状态机与版本不可变规则
  ruling: RESOLVED 之后必须先经 GATE_ELIGIBLE 才可到 CLOSED；禁止 RESOLVED→CLOSED 跳关，跳过 Gate 资格校验等同绕过 Gate 门禁，一律拒绝。

- object: PatternRecord
  ruled_by: AFS-P0-FREEZE-2026-11-13-01
  authority: C.3 对象总表（PatternRecord 行）
  ruling: >-
    以 C.3 为准：EXPERIMENT_RECORD→IN_REVIEW→REUSABLE_PATTERN/REJECTED/FAILURE_CASE，
    REUSABLE_PATTERN→DEPRECATED→RETIRED。26.2 的 REJECTED_PROPOSAL 与 REJECTED 同义，按 C.3 记 REJECTED；
    26.2 未列 DEPRECATED、RETIRED 属描述省略，不构成第二套状态集。26.2 的晋升条件（质量证据、版权审查、适用边界说明、责任人审批）为准入规则，与状态转移并行适用。

# 只有正文、未建模的对象：有状态链但对象尚未进入 object_schemas，属显式缺口而非「无状态机」。
text_authority_only:
- object: SharedReferenceAsset
  source_sections:
  - 26.2 资产生命周期和权威边界
  kind: paragraph_authority_unmodeled_object
  note: >-
    26.2 给出了共享参考资产状态链（DRAFT→RIGHTS_CHECK→VALIDATED→AVAILABLE→DEPRECATED/REVOKED/QUARANTINED），属跨项目共享条目治理；
    该对象尚未进入 object_schemas.schema.json，P0 期间以 26.2 正文为权威（有状态链、只是未建模，不属“无状态机”），建模后须按 31.11 启用前复核补登状态机。

# UI 投影：不是持久化对象，不进对象数，不得进枚举注册表。
projections:
- object: TimelineFlowStatus
  authoritative_source: 33.3 状态机、编辑与 STALE 传播
  kind: ui_projection
  allowed_states: [DRAFT, VALIDATED, EXPORTED, IMPORTED, RETURNED]
  fields: [TimelineDraft.status, ToolExchangeSession 事件]
  note: >-
    UI 进度投影，不是持久化领域对象，也不是独立状态机：它把 TimelineDraft 的状态与 ToolExchangeSession 的 EXPORTED / IMPORTED 事件拼成一条给人看
    的进度条。IMPORTED / RETURNED 只来自 ToolExchangeSession 事件，不存在于 TimelineDraft.status。
    因此本条目不得进 object_schemas 的 status.enum，不得被运行时当作可写入状态。
  all_sources: [33.3 状态机、编辑与 STALE 传播]

objects:
- object: Appeal
  authoritative_source: 31.5 社区对象状态机最终定义
  allowed_states: [CLOSED, DECISION_OVERTURNED, DECISION_UPHELD, IN_REVIEW, SUBMITTED]
  transitions:
  - {from: DECISION_OVERTURNED, to: CLOSED}
  - {from: DECISION_UPHELD, to: CLOSED}
  - {from: IN_REVIEW, to: DECISION_OVERTURNED}
  - {from: IN_REVIEW, to: DECISION_UPHELD}
  - {from: SUBMITTED, to: IN_REVIEW}
  note: DECISION_UPHELD 表示原处置决定维持；DECISION_OVERTURNED 表示原决定被撤销或改判；申诉不自动恢复内容，恢复须单独执行并审计。
  all_sources:
  - 24.11 社区状态机、分享链接与复用状态机
  - 31.5 社区对象状态机最终定义

- object: AssetVersion
  authoritative_source: 8.5 Asset 生命周期
  allowed_states: [APPROVED, ARCHIVED, GENERATED, GOLD, HUMAN_REVIEW, QUARANTINED, REJECTED, REWORK, SUPERSEDED, TECHNICAL_QC]
  transitions:
  - {from: APPROVED, to: GOLD}
  - {from: GENERATED, to: TECHNICAL_QC}
  - {from: HUMAN_REVIEW, to: APPROVED}
  - {from: TECHNICAL_QC, to: HUMAN_REVIEW}
  # 资产版本是叶子对象：没有子对象引用它，冻结策略不适用。显式写 [] 而不是省略，
  # 判据才能区分「本对象不冻结子集合」与「忘了给这个对象表态」。
  frozen_states: []
  note: >-
    8.5 标题写“Asset 生命周期”，对应受控资产版本对象 AssetVersion。QUARANTINED 不得直接转 GOLD，必须补齐证据并经授权复核；
    分支进入各旁支的具体前置条件正文未逐条给出，未登记的状态转移一律拒绝。
  source_kind: paragraph_state_machine
  all_sources:
  - 8.5 Asset 生命周期

