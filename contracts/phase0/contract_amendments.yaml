    source_commits: []
    additions:
      schema_objects:
        - object: 'Scene'
          why: '场次聚合根；是 Shot.scene_id / ShotRevision.scene_id 的引用目标与复合外键 (project_id, scene_id) 的被引用对象。14 属性 / 14 必填，additionalProperties=false'
      state_machines:
        - object: 'Scene'
          why: 'DRAFT→ACTIVE / ACTIVE→ARCHIVED / DRAFT→ARCHIVED，ARCHIVED 终态；状态集镜像 Episode（source_kind: derived_from_parent_lifecycle），非正文原文'
    counts_after:
      actions: 84
      openapi_operations: 84
      schema_objects: 83
      state_machines: 42
    residual_risks:
      - 'Scene 运行时全无：无 ORM、无迁移、无 service、无 action。所有者要求的 FOREIGN KEY (project_id, scene_id) 与 UNIQUE (project_id, shot_code) 仍是纸面约束，八条不变量全部 RUNTIME_PENDING'
      - '创建入口未定：本轮刻意未把 SHOT.REVISION.CONFIRM 的 resource_type 扩为 Shot/ShotRevision/Scene——那等于替所有者裁定「确认拆镜即建立正式场次」，须在 Scene 运行时设计时一并裁定'
      - '稳定场次是否应持有描述性内容、是否需要 SceneRevision：正文未定义，待裁定；当前内容只在 ShotBreakdownDraft 的场次层'
      - '32 个有状态机的对象 status 仍是裸 string（实测 41 个中仅 9 个收 enum）：Scene 收 enum 而 Project / Episode 未收，口径差异已在 ADR-R19 说明，需一次独立迁移，本轮不夹带'
      - '引用目标闸门只覆盖 4 个对象 24 条声明：全 schema 475 个引用类字段中 456 个未声明；按命名自动推导会产生 393 条误报（entity_id / audit_ref 等非对象引用），故不做，覆盖边界写进 PASS 输出'
