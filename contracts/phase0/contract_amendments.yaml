  - id: 'V205-R15-A31'
    title: '生成→QC 入队改为 outbox 事件驱动；GENERATION_SUCCEEDED payload 补产物与归属'
    retroactive: false
    recorded_at: '2026-11-23'
    discovered_by: '2026-11-23 第五轮工程审查 P1-03（跨域提交顺序不可靠）'
    reason: >-
      原实现里生成 Worker 在自己事务的 finish 之后、commit 之前，用独立 QC 会话直接写
      qc_governance.qc_tasks 并立刻提交。顺序因此是「QCTask 先落库、GenerationTask 后提交」；
      生成域提交失败就留下一条指向不存在生成任务的待检项，而 qc_tasks.generation_task_id
      是跨域引用、没有物理外键，数据库拦不住这种悬空引用。
      本条目把入队改为事件驱动：GENERATION_SUCCEEDED 与生成终态在同一事务写入 outbox，
      事件存在即等于终态已提交，QC 域由 relay 消费后入队（至少一次投递，
      按 generation_task_id 唯一约束幂等），因此「待检项先于生成成功」在结构上不可能发生。
      为此 GENERATION_SUCCEEDED 的 payload 契约补四项必需事实：
      asset_version_id、quality_profile_version、project_id、shot_id——
      消费方没有产物引用就无从确定待检资产，没有归属就必须反查，而反查可能读到新版本。
      本条目不含动作/Schema/状态机增删（Action 105 / Schema 89 / 状态机 48 不变），
      但**实质性变更事件载荷契约**，故单独登记而非并入 A30。
    adr: 'docs/architecture/amendment-pack-r16-phase2.md'
    approved_by: '项目所有者（2026-11-23 会话内指令「全部整改」，授权按审查 P1-03 整改跨域事务顺序）'
