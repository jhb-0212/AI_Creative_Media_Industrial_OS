        - object: 'ArtifactManifest'
          why: '持久化产物写入意图（locator/sha256/attempt_id/status），崩溃后可按 PREPARED 记录重试对象写入而不重复调用模型（C2）'
        - object: 'AssetRegistrationReceipt'
          why: '不可变登记回执，(tenant_id, generation_task_id) 唯一，作为跨域幂等与成功终态的权威来源（C5）'
      state_machines:
        - object: 'ArtifactManifest'
          why: 'PREPARED → STORED_VERIFIED 描述对象写入意图到存储确认的跨阶段推进（T0/T1）'
        - object: 'AssetRegistrationReceipt'
          why: 'COMPLETED/REJECTED 为互斥结果分类；两态均 frozen，表达回执不可原地改写（T2/T3）'
