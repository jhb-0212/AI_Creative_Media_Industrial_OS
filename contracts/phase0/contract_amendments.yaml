  - id: 'V205-R42-P2-RATIFY'
    title: 'P2 追认：PR-G-2 media_type 事实化 / PR-G-3 ABANDONED 终态（Owner 2026-11-25 裁决）'
    retroactive: true
    recorded_at: '2026-11-25'
