      RUNTIME_PENDING：生成域尚无消费者，定级 ENFORCED 就是虚假声明。

      四、库层约束（见 constraints.added）。数组元素无法用外键表达，shot_ids 的归属
      用触发器而不是关联表：关联表会让契约字段 shot_ids 降级成派生投影，库里同时存在
      「数组」与「关联行」两份事实。触发器的 ERRCODE 取 23503，与真外键共用同一条
      错误映射，不为它新增翻译分支。
