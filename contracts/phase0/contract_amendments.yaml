      把它补成四层一致，并在补的过程中发现契约本身缺一个治理入口。
    reason: >-
      一、新增 CONSTRAINT.PACK.READ（LOW）。CREATE / LOCK 之外没有任何读取入口，
      「包建好了」在 API 层面不可见，锁定用例也无从取得当前状态。读取不改状态，
      故不登记审计事件（与 SCENE.READ / SHOT.READ / SHOTSPEC.READ 同口径）。

      二、新增 CONSTRAINT.PACK.STATUS.CHANGE（HIGH，导演/授权 TD）。7.9 画了三条治理边
      （ACTIVE→REVOKED / STALE / SUPERSEDED），但 31.6 没有任何动作拥有它们——这是一个
      真实的契约缺口：有了边却没有人负责走。不能把三条边塞给 CONSTRAINT.PACK.LOCK：
      LOCK 回答「这份包的锁定义务已尽」，治理边回答「这份包此后还能不能被用」，
      共用一个入口会让「锁一份新包」与「撤销一份已生效的包」成为同一种通行证
      （正是 N-07 修掉的形态）。本批只登记动作、不实现入口——三条边的下游消费者
      （生成路线选择、STALE 传播）尚未落地，现在实现只能得到「能改状态、没人读」的边。
      逐边债务登记在 contracts/runtime/state_machine_gaps.yaml。

      三、七条不变量定级（CP-1…CP-7）。7.9 的字段契约里写着若干「必须/不得」，此前
      只活在文档里：applicability 与内容自洽（CP-1）、锁定维度受控七值（CP-2）、
      条目八字段必填与 id 包内唯一（CP-3）、作用镜头真实且同项目（CP-4）、
      包与项目同租户（CP-5）、同包至多一个 ACTIVE 版本（CP-6）——六条都由领域校验 +
