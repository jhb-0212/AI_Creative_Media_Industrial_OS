    discovered_by: >-
      7.9 早已给出 ConstraintPack 的完整字段契约（包级 12 字段 + 条目 8 必填字段）、
      五状态四边，31.6 也登记了 CONSTRAINT.PACK.CREATE / LOCK，但库里没有任何对应物，
