  - id: 'V205-R14-A9'
    title: '状态枚举统一迁移——allowed_states 与转移图分离、枚举派生、四层一致性闸门'
    retroactive: false
    recorded_at: '2026-11-18'
    discovered_by: 'V205-R14-A8 残余风险第 4 条（32 个对象 status 仍是裸 string）；项目所有者 2026-11-18 复核 main 时指出 A8 的 32/9 口径已过期且 enum_registry 只比对象名不比状态集，批准本项作为独立任务立项'
    reason: >-
      状态集合此前有三份手写副本：state_machines 的文本状态链、enum_registry 的状态列表、
      Schema 的 status.enum。三份各自手改，于是同时存在三种漂移而闸门全绿：
      state_machines 有状态而 Schema 是裸 string（76 个 status 中 70 个）、
      enum_registry 有状态而 state_machines 没有（PG0 / PG3 / PMS / PASS / PUBLISHED）、
      Schema 有 enum 而权威集合没有（BudgetTransferRequest 的 8 个值）。
      根因不是「谁忘了改」，而是**没有一条规则把三处连起来**：旧闸门只比对对象名集合，
      且注释明写「刻意不比状态集」，所以任何一处状态漂移都不可见。
      本修订做三件事：(1) 把状态机从自由文本改成 allowed_states + transitions 两个结构字段，
      让「允许出现哪些值」与「已授权哪些边」各自可校验——旁支状态（AssetVersion 的
      QUARANTINED、Task 的 WAITING_FOR_PROVIDER）允许存在但可以没有入边，旧文本结构
      无法表达这一点，导致枚举要么漏掉合法值、要么从备注里乱抓；(2) 让 enum_registry 与
      Schema 的 status.enum 都由 allowed_states 生成（scripts/gen_status_contracts.py），
      并用「重算一遍比字节」的闸门禁止任何手改派生文件；(3) 新增 status 字段分类台账
      （status_field_taxonomy.yaml），把 76 个 status 字段落成 39 个 lifecycle + 18 个
      envelope_only + 19 个 lifecycle_gap——没有权威状态集的对象不编造枚举，但必须留下
      带 reason/contract_ref/unblocks_when 的缺口债务，删条目不能让闸门变绿。
      清单口径同时修正：CharacterCard 与 CharacterAppearance 由 C.7 一条合并登记拆成两条
      （两者共享同一状态集，C.3 未列 REJECTED/QUARANTINED 属描述省略，按 CharacterCanon /
      ShotVisualPlan 同一裁决口径）；TimelineFlowStatus 是 UI 进度投影而非持久化对象，
      移入 projections 分区且不进枚举注册表；BudgetTransferRequest 的孤儿枚举反向补登为
      状态机（transitions 留空——正文只写了人工申请→人工审批→原子记账，未给边，
      Phase 2 启用前不得推定）。运行时只对已落库的四张表收口：Domain Enum 与 status CHECK
      约束都由契约状态集生成，闸门逐字比对，未实现的对象不提前造 ORM 或假约束。
    adr: 'docs/adr/ADR-R20-status-enum-single-source.md'
    approved_by: '项目所有者（会话内立项指令：「状态枚举统一迁移，批准立项。第一步不是直接修改 32 个对象，而是从当前 main 重新生成准确的状态枚举清单」）'
    approved_at: '2026-11-18'
    source_commits: []
    additions:
      state_machines:
        - object: 'BudgetTransferRequest'
          why: '对象在 object_schemas 里已有 status.enum（8 个值）却从未登记状态机，属「Schema 有状态、权威集合没有」的孤儿枚举。本轮按既有 schema 枚举反向补登 allowed_states，transitions 留空（正文未给边），registration_status: PENDING_PHASE2_REVIEW，Phase 2 启用前须所有者复核'
        - object: 'CharacterAppearance'
          why: 'C.7 原文以「CharacterCard / CharacterAppearance」一条状态机登记两个对象。拆成两条后两个对象各有独立条目、共享同一状态集（8 态），消除「一个对象两条/零条权威」的歧义'
    removals:
      state_machines:
        - object: 'CharacterCard / CharacterAppearance'
          why: '合并条目被上一条的拆分取代：该键不是合法对象名（object_schemas 里没有斜杠命名的对象），保留它会让「状态机对象集」与「Schema 对象集」永远无法逐名比对'
        - object: 'TimelineFlowStatus（UI 投影）'
          why: '33.3 的 TimelineFlowStatus 是 UI 进度投影（由 TimelineDraft.status 与 ToolExchangeSession 事件拼成），不是持久化领域对象。它进对象状态机清单等于把派生视图当实体，draft 的 status.enum 也会被要求收 IMPORTED/RETURNED 这种只来自事件的值。已移入 state_machines.projections 分区，不计入对象数、不进枚举注册表'
    counts_after:
      actions: 84
      openapi_operations: 84
      schema_objects: 83
      state_machines: 42
    residual_risks:
      - '19 个对象的 status 仍是裸 string（lifecycle_gap）：BlockingAsset / CameraRig / CharacterReferenceSet / CharacterVoiceProfile / ContinuityConstraint / ControlSignalAsset / CreativeProposal / DeliverySpec / EscapeReport / ExternalToolArtifact / IntentContract / ProjectProductionProfile / Report / ShotProductionProfile / ShotResourceAllocation / ShotSpec / ShotTierChangeRequest / TimelineManifest / ToolExchangePackage。逐个给出 reason/contract_ref/unblocks_when，闸门双向校验，但「有债务」不等于「已约束」——这些字段目前仍接受任意字符串'
      - '18 个对象的 status 被判定为 envelope_only（无独立生命周期）：其中 4 个是 status_split（ExternalToolAdapterManifest.lifecycle_status、ModelInvocation 的 submission/result/billing_status、PrevizVersion 的 approved_at+ purity_check_status、QCIssue 的 disposition），这批对象存在「两个 status 事实」的结构问题，按 R4 应合并而非并存，但合并属契约修订，本轮只显式登记不擅自动手'
      - 'Pattern 与 PatternRecord 状态链逐字相同而只有后者有 schema：是否同一对象尚未裁定，暂以 schema_gaps 条目登记，不擅自合并（合并会掩盖两章命名差异，不合并则缺一条 schema）'
      - 'PublicationReview / CreatorShareLink 仍无 object schema（状态机有、字段无处校验），已登记 schema_gaps；PublicationReview 的「审核人与提交人分离」目前只有状态机 note 一句话，没有字段级约束'
      - 'BudgetTransferRequest 的 allowed_states 取自既有 schema 枚举而非正文：正文只写「人工申请→人工审批→原子记账」。这属反向补登，Phase 2 启用前须所有者复核，否则等于让既有实现定义了契约'
      - '运行时只收口四张已落库表（projects / episodes / script_revisions / asset_versions）：其余 38 个对象没有 ORM、没有表、没有 CHECK，契约层级约束已成立但运行时不可执行（如实标记，不提前建空表）'
      - 'object_schemas 中既有 5 个 enum（Scene / Shot / ShotBreakdownDraft / ShotRevision / Task）的书写顺序同步为字母序：语义不变（闸门按集合比对），但评审时会看到纯顺序 diff'
      - '本修订解除 A8 残余风险第 4 条（32 个对象裸 string），并修正其 32/9 统计口径（实测 76 个 status 中 70 裸 / 6 收 enum）；其余残余风险不变'

