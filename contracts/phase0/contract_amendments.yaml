  - id: 'V205-R15-A32'
    title: 'QC 终结前核验报告归属；跨域证据端口下沉中立层'
    retroactive: false
    recorded_at: '2026-11-23'
    discovered_by: '2026-11-23 第五轮工程审查 P1-04（QC 归属前置阻断与审核闭环）'
    reason: >-
      结清 A31 登记的第二条残余风险：「终态校验报告存在且属于本任务资产版本」。
      原实现里 QCTaskService.finish 只判 qc_report_id 非空。qc_tasks.qc_report_id
      是跨域引用、没有物理外键（两域分 schema），于是任何持有 QC.TASK.PROCESS 的
      调用方提交一串随便编的字符串就能把任务推成 PASSED——「有 ID」被当成「有证据」，
      而这恰好是 QC 存在的意义所在。
      本条目把核验放到 require_lease_owner 之后：未装配核验器即 fail-closed 拒绝
      （装配错误立刻暴露，而不是悄悄退化成「看起来通过」）；报告不存在、资产版本
      不符、租户不符三种情形分别显式拒绝。
      同一条审查还发现 AssetIntegrityInspector 在资产不属于任务声明项目时只记一条
      project_scope.passed=False 的 finding，随后仍写报告、仍把资产从 GENERATED
      推进到 TECHNICAL_QC——同一租户内项目 A 的任务可以通过错误引用影响项目 B 的
      资产。本条目把它改为执行前的准入条件（模块级 assert_asset_within_task_scope），
      因为「发现了错误引用」不等于「阻止了错误引用的副作用」；project_scope finding
      保留为「已核验」证据（报告 append-only，读报告的人无法从别处推断当时验过）。
      实现方式上有一个架构约束必须记明：核验要读资产域，而分层规则 R2 禁止 services
      之间互相 import。四种做法只有一种对——QC 域 import 资产域（违反 R2）、资产域
      import QC 域的 DTO（同样违反 R2，只是方向反过来）、登记成平台能力白名单
      （这不是平台能力，且白名单会变成常驻后门），因此把契约下沉到中立层
      packages/shared/evidence_ports.py，读取口径由数据属主
      （services/asset_service/repository/qc_report_lookup.py）提供，装配由组合根
      （apps/api/wiring.py 与 workers/qc/__main__.py）完成。平台能力白名单因此仍是
      2 项、未新增条目。
      本条目不含动作/Schema/状态机增删（Action 105 / Schema 89 / 状态机 48 不变）。
