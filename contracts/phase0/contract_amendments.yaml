  - id: 'V205-R14-A13'
    title: 'Scene / Shot / ShotRevision / ShotBreakdownDraft / ReworkTask 运行时入口'
    retroactive: false
    recorded_at: '2026-11-20'
    discovered_by: 'docs/adr/ADR-R28-scene-shot-rework-runtime-entry.md；ADR-R19 §121（Scene 创建入口未定）、ADR-R18 §12（首次确认原子创建 Shot + ShotRevision）、A12 残余风险第 2 条（审批事实无独立对象）'
    reason: >-
      契约侧四份 ADR 已把对象钉死，运行时一行代码都没有，且存在一条首尾相接的阻塞链：
      Shot.required 含 shot_revision_id → 需要 ShotRevision → 唯一创建入口是
      SHOT.REVISION.CONFIRM → 其输入是 ShotBreakdownDraft → 唯一入口是
      SHOT.DRAFT.CREATE。任何一环单独实现都会立刻撞上下一环。同时 Shot 的 10 条转移边
      中 6 条带守卫，守卫依赖的 ReworkTask（无表）与授权记录（无契约对象）都不存在。
      本修订把整条链一次接通，避免留下三处半成品；动作增量 10 个，对象与状态机均已存在，
      故 schema_objects / state_machines 不变。四项裁定见 ADR-R28 §2：ReworkTask 随批建表、
      授权记录用 authority_ref 字符串承载、表 + API + 动作全出、4 条无入口边与入口同时开放。
    adr: 'docs/adr/ADR-R28-scene-shot-rework-runtime-entry.md'
    approved_by: '项目所有者（2026-11-20 会话内逐条裁定四项决定）'
    approved_at: '2026-11-20'
    source_commits: []
    additions:
      actions:
        - action_key: 'SCENE.CREATE'
          why: '场次登记。与 EPISODE.CREATE 同型：同层级、同归属校验、同幂等语义。刻意不让 SHOT.REVISION.CONFIRM 隐式建场次——ADR-R19 §121 已拒绝替所有者裁定「确认拆镜即建立正式场次」。'
        - action_key: 'SCENE.READ'
          why: '场次读取。组织边界由统一授权入口判定，租户边界由 RLS 保证。'
        - action_key: 'SCENE.STATUS.CHANGE'
          why: '拥有 Scene 的全部 3 条边（DRAFT→ACTIVE、DRAFT→ARCHIVED、ACTIVE→ARCHIVED）。ARCHIVED 为终态，不可原地复活。'
        - action_key: 'SHOT.READ'
          why: '镜头读取。'
        - action_key: 'SHOT.STATUS.CHANGE'
          why: '拥有 Shot 的全部 10 条边，其中 6 条带守卫：blocked_reason（进入 BLOCKED 两条）、rework_basis_ref（返工回退一条）、cancellation_ref + cancelled_at（取消三条）。守卫在领域层求值，库层 CHECK 兜底。'
        - action_key: 'SHOT.DRAFT.CONFIRM'
          why: '拥有 ShotBreakdownDraft 的 2 条边（PENDING_CONFIRM→IN_REVIEW 认领、IN_REVIEW→CONFIRMED 确认）。两跳同一事务、同一 owner_action，写两条迁移事实；认领跳不单独发事件。'
        - action_key: 'SHOT.DRAFT.RETURN'
          why: '拥有 IN_REVIEW→RETURNED。RETURNED 是版本终态，修改走新版本，不回退到 PENDING_CONFIRM。'
        - action_key: 'SHOT.DRAFT.DISCARD'
          why: '拥有 PENDING_CONFIRM→DISCARDED 与 IN_REVIEW→DISCARDED。'
        - action_key: 'REWORK.TASK.CREATE'
          why: '返工任务登记。归属 project_planning 域：Shot.rework_basis_ref 的守卫需要同域校验，跨域会退化为字符串非空，守卫名存实亡（ADR-R28 §3.3）。'
        - action_key: 'REWORK.TASK.STATUS.CHANGE'
          why: '拥有 ReworkTask 已登记的 4 条边（OPEN→IN_PROGRESS→DONE→VERIFYING→CLOSED）。REJECTED 无入边，契约已登记「合法但当前无授权入口」，本批不擅自补边。'
        - action_key: 'SHOT.DRAFT.READ'
          why: '草案读取。不能复用 SHOT.DRAFT.CREATE 做读授权：那会把「能读」与「能创建」绑成一个能力，读取方（如 QC 审核人）将被迫获得创建权。'
        - action_key: 'REWORK.TASK.READ'
          why: '返工任务读取。同理不能复用 CREATE：QC 与制片需要查看返工依据，但不应因此获得登记权。'
    counts_after:
      actions: 96
      openapi_operations: 96
      schema_objects: 84
      state_machines: 43
    residual_risks:
      - 'affected_asset_version_ids 是跨域 ID 数组，只能值引用不能加外键：资产删除后引用悬空，消费方只做展示与追溯，不做存在性强校验'
      - 'cancellation_ref 是字符串，无法在库层证明它指向一次真实授权（D2 的直接代价）：缓解是把同一值同时写入 audit.status_transitions.authority_ref 与 evidence_refs，由审计侧按前缀路由到签发系统'
      - 'ReworkTask.REJECTED 无入边：契约已登记该状态合法但无授权入口，补边需所有者给出「谁有权驳回返工」的口径'
      - 'ShotRevision 每 Shot 一个 ACTIVE 依赖部分唯一索引兜底并发确认；正确性需真实 PostgreSQL 负测证明，当前环境未验证'

