        - action_key: 'QC.TASK.RECOVER'
          why: '人工恢复入队入口。与自动入队分离后，专项席位、权威归属核验、生命周期约束可各自验收；共用 UNIQUE(generation_task_id) 幂等事实，不产生重复有效 QC 任务'
    source_commits:
      - '54aa49ff1721d660f3ccdc11672986f846ddd1eb'
    counts_after:
      actions: 106
