      - 'Project/Episode/ScriptRevision 的权限矩阵条目仍需在包 B（身份与数据所有权）中补齐资源范围授权'

  - id: 'V205-R14-A2'
    title: 'Phase 6 状态推进入口——Project/Episode 生命周期状态变更动作'
    retroactive: false
    recorded_at: '2026-11-17'
    discovered_by: 'docs/audits/2026-11-16-review-round3.md（第三轮深度审查，F01）'
    reason: >-
      基线（含 A1 修订）只给了 Project/Episode 的 CREATE/READ 动作，域状态机
      已有转移表（Project 7 条边、Episode 3 条边），但没有任何 action 能触发
      这些转移——项目创建后停在 DRAFT，平台无法推进到生产态（审计 P2-1、
