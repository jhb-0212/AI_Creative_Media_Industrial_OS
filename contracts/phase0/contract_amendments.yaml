  - id: 'V205-R14-A15'
    title: 'SC-5 并发窗口根治（父行锁协议）；23505 映射逐路径核对'
    retroactive: false
    recorded_at: '2026-11-21'
    discovered_by: >-
      A14 交付后逐条复核剩余风险，两项被要求「要么实现、要么说清为什么不做」：
      ① SC-5 归档前置条件只做到「同事务查询 + 拒绝」，查询与写入之间的并发窗口仍在；
      ② A13 债务第 7 条指出 23505 未翻译成统一 409，需逐路径核对。
    reason: >-
      两项都不改契约文本（SC-5 的陈述本身已包含两侧语义），改的是**实现强度**。
      ① 归档前置条件从「查一次」升级为成对的行锁协议：父侧持排他行锁重判，子侧
      （镜头进入 IN_PRODUCTION）持同一行的共享锁后确认父场次未归档。这不是加兜底
      而是消除结构性缺陷——唯一索引表达不了「子行集合里不得存在某状态」，延迟约束
      在 READ COMMITTED 下是 write skew（双方都看不到对方未提交的改写），
      SERIALIZABLE 要全库所有写路径付序列化重试代价。代价是写入协议多一条不变量：
      加锁顺序必须父→子。
      前置条件声明挂在 Transition 边上（ParentPrecondition / ChildPrecondition），
      触发条件由边表派生而非服务层手写分支：进入在产的边有三条、进入归档的边有
