  - id: 'V205-R14-A21'
    title: 'ShotSpec 契约补全——状态机、创建入口与 status 枚举归位'
    retroactive: false
    recorded_at: '2026-11-21'
    discovered_by: >-
      实现 Phase 1 主链下一环（人工确认 → ShotSpec → ConstraintPack）时的契约核对，
      发现三处缺口叠在同一个对象上：object_schemas 有 ShotSpec 定义，但 status 是裸
      string 且无状态机；state_machines.yaml 根本没有该对象；Action Registry 只有
      SHOTSPEC.LOCK，没有任何创建入口——于是「锁定」这个动作没有对象可锁。
      status_field_taxonomy.yaml 早已把 ShotSpec 记为 lifecycle_gap，解除条件写明
      「须与 ShotVisualPlan 的 PARTIALLY_LOCKED/LOCKED 对齐，不得自创第二套锁定命名」。
    reason: >-
      一、状态集取 DRAFT / LOCKED 两态（所有者裁定，正文未给）。三个边界都是刻意的：
      ① 不设 PARTIALLY_LOCKED——ShotVisualPlan 的该状态依赖一套「必锁维度全集」，而
      8.12 只给 locked_dimensions 字段、没给全集；没有全集，「部分」锁定到哪为止不可
      判定，等于把一个不可验证的判断塞进状态机。部分锁定的事实仍由 locked_dimensions
      记录，不丢信息。② 不设 SUPERSEDED——规格随修订版本化（SS-2 要求绑定精确
      shot_revision_id），换版发生在 ShotRevision 层：新修订要有新规格，旧规格对其
      修订仍然有效，没有「被取代」的语义。③ LOCKED 为终态：改规格必须新修订 + 新规格，
      不得原地解锁（红线「终态不可原地复活」）。命名共享 DRAFT/LOCKED，不引入第二套
      锁定词汇。

      二、新增 SHOTSPEC.CREATE（MEDIUM / Agent·TD·导演 / audit_event
      SHOTSPEC_CREATED / 负测 ACT-SPEC-NEG-002 跨修订或跨项目绑定拒绝）。
      为什么不让 SHOTSPEC.LOCK 兼做创建：LOCK 是 HIGH 风险动作，它的语义是「为已有规格
      的锁定维度、依据与审批事件盖章」；让它在对象不存在时顺手写入一份新规格，等于把
      一次未受创建侧校验的写入藏在审批动作里。创建与确认分离是本项目既有口径
      （SHOT.DRAFT.CREATE 与 SHOT.DRAFT.CONFIRM 就是两个动作）。

      三、status 归位 lifecycle 类：enum_registry 与 schema 的 status.enum 由
      state_machines.allowed_states 派生（scripts/gen_status_contracts.py），
      taxonomy 的 lifecycle_gap 债务条目随之删除（陈旧债务会被闸门报红）。

      本修订只补契约，不动运行时：SHOTSPEC.CREATE / SHOTSPEC.LOCK 均登记为
      not_implemented，端点与表在下一批实现；SS-3（切点单调）仍为 RUNTIME_PENDING，
      待实现时与代码同批定级。
    adr: 'docs/adr/ADR-R28-scene-shot-rework-runtime-entry.md'
    approved_by: '项目所有者（2026-11-21 会话内选择「ShotSpec 契约+实现」，授权契约先行）'
    approved_at: '2026-11-21'
    source_commits: ['f064fb5']
    additions:
      actions:
        - action_key: 'SHOTSPEC.CREATE'
          why: 'ShotSpec 此前没有创建入口，SHOTSPEC.LOCK 无对象可锁；创建与锁定必须分离，避免 HIGH 风险动作静默写入新事实'
      state_machines:
        - object: 'ShotSpec'
          why: '8.12 未给状态集；DRAFT/LOCKED 两态把「已锁定不可原地修改」变成可机读事实，并为 SHOTSPEC.LOCK 提供唯一合法边'
    counts_after:
      actions: 97
      openapi_operations: 97
      schema_objects: 84
      state_machines: 44
    residual_risks:
      - 'ShotSpec 的状态集属所有者新增建模，8.12 未给；若正文后续补锁定口径（尤其是否需要 PARTIALLY_LOCKED），须改状态机并另立修订'

