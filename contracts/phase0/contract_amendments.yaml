  - id: 'V205-R15-A36'
    title: '产物意图的崩溃恢复与 media_type 事实化（ADR-R42 PR-G 补齐）'
    retroactive: false
    recorded_at: '2026-11-24'
    discovered_by: '2026-11-24 外部代码审查报告（基线 dadbb17c）§五 R42 PREPARED 恢复缺口；ADR-R42 :94「失败恢复的权威依据是持久化事实」'
    reason: >-
      审查报告列出 PR-G 四项缺口：PREPARED 崩溃恢复未实现、manifest 未持久化 media_type、
      无「放弃」终态、治理授权未对账。前三项是同一根因的三个面：产物意图只活在 Worker 内存里，
      T0 提交后崩溃就变成不可判定的孤儿行——既不能证明对象已写入（没有 media_type，
      「是不是同一产物」不可判定），也没有终态表达「已放弃」。后果是重启后一律重新调模型，
      产物重复计费，PREPARED 行永久悬挂。A35 与 V205-R42-T2-FINGERPRINT 两条修订都显式写了
      「不做 PREPARED 恢复（PR-G）」，本条目即时销项。
      三件事一并做到事实层：① ArtifactManifest 增加 media_type（NOT NULL，按 locator 扩展名
      回填），T0 校验 locator 与 media_type 双射、T1/T2/T3 全链路比对，使「同一产物」成为
      可判定命题；② 新增 ABANDONED 终态与 PREPARED→ABANDONED 边（owner 为
      GENERATION_PROCESS_ACTION，frozen_states 含 STORED_VERIFIED 与 ABANDONED），放弃必须
      带 audit_ref 证据且不删除意图行——放弃本身是可审计事实，不是清理动作；③ 恢复入口按
      存储事实三态区分：确定不存在（StorageObjectMissingError）与已损坏（StorageIntegrityError）
      放弃并重生成，暂不可用（StorageUnavailableError）不放弃、报告失败留待重试。第三态是
      本条目最关键的判据：把一次 I/O 抖动判成「对象没了」会永久丢失已付费产物，比崩溃本身更贵。
      恢复路径沿用原 attempt_id 走 T2，不重复调用模型，也不新建第二个 manifest。
      第四项（治理授权对账）不改契约，落在 docs/audits/2026-11-24-r42-authorization-reconciliation.md：
      澄清 ADR 的「不激活实现」是文件自身范围声明而非禁止实施，并汇总已落纸的授权事实
      （A35 的 approved_by / source_commits）。C7 / D6 两个口径仍待 Owner 签署，不在本条目内改代码。
