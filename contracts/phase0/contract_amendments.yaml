    discovered_by: '业主 2026-11-23 设计裁决（ADR-R42 附录 A 四阶段修订 + C1–C7 契约变更清单）'
    reason: >-
      当前 GenerationTask 只有 REQUESTED/RUNNING/SUCCEEDED/FAILED，Worker 可以凭一个
      非空 asset_version_id 直接把任务推到 SUCCEEDED——资产域是否真的登记、归属是否
      匹配、质量档案是否存在，都没有结构性证据。根因是「生成成功」被定义为模型调用
      成功而非资产登记成功，且产物只在 Worker 内存里持有，进程崩溃后无法重建登记请求。
      按 ADR-R42 裁定改为以资产域回执为成功终态权威：GenerationTask 增加等待登记态
      AWAITING_ASSET_REGISTRATION；新增 ArtifactManifest 记录写入意图（PREPARED）与
      存储确认（STORED_VERIFIED）；新增不可变 AssetRegistrationReceipt 以
      (tenant_id, generation_task_id) 为业务幂等键。SUCCEEDED 的最终权威是 T3 消费登记
      完成事件；RUNNING→SUCCEEDED 与 REQUESTED→SUCCEEDED 两条过渡边保留至 PR-D，
      删除条件可机检：T3 事件处理器已实现、state_machine_gaps.yaml 两条入口债务已销项、
      Finish 请求不再携带自报资产 ID。PR-B 只声明目标态，不提前切断运行时入口——
      否则中间提交无法完成任何任务。T3 两条边的 owner_action 是事件名而非已实现
      action，入口债务显式登记在 state_machine_gaps.yaml，不得用 GENERATION.PROCESS
      占位（那等于保留自报成功入口）。
      ProductionRoute 与 GenerationTask 同步增加 quality_profile_version，使质量策略
      在任务创建时冻结、成为不可变任务输入。本条目只落地契约层（Schema/状态机/分类
      台账/运行时状态机投影）；API 请求字段移除、数据库表与迁移、Saga 事件发射与
      消费分别由后续 PR 落地，不在此条目宣称已完成。
