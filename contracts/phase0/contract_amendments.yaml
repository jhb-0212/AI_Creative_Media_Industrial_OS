      - 'Shot 无运行时、无镜头表：原子创建、版本指针前移、状态推进、shot_code 项目内唯一约束均无落点；八条不变量只有 SH-5 与 SH-8 可由 schema 表达'
      - 'shot_code 未加 pattern：不同项目编号习惯不同（EP001-SC003-SH012 仅是示例），强行正则属于过约束；唯一性依靠数据库 (project_id, shot_code) 唯一索引'
      - 'duration_ms / timecode 归属冲突：所有者本轮口径为「时长与时间码归 ShotSpec」，但 ADR-R17 已把两者放进 ShotRevision 并冻结；本轮不改已冻结契约，差异与两条迁移路径见 ADR-R18「待裁定差异」'
      - '五态是所有者设计决策、非正文原文：下一版正文若给出不同状态集，须走契约修订对齐，不得让实现与契约各自解释'
      - '冻结闸门按名称集合判定增删，识别不了「同名 action 指向不同对象」：SHOT.REVISION.CONFIRM 的 resource_type 由 ShotRevision 改为 Shot/ShotRevision 属同名改写，登记在案而非靠闸门发现'
      - '审批事实仍无独立对象：cancellation_ref / rework_basis_ref 指向授权记录，但「谁在什么授权下批准了什么」无专用对象，与 AUTH-3 累积式会签同源；刻意不另造审批子对象，避免第三份审批事实源'

