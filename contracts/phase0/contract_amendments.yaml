      schema_objects: 99
      state_machines: 56
    residual_risks:
      - '实现未落地：QC.TASK.RECOVER 在 action_implementations.yaml 登记为 not_implemented，POST /qc-tasks 现有行为未变。缺口没有消除，只是第一次被契约命名并可判定——持有 QC.TASK.ENQUEUE 的调用者仍可为不存在的资产、或自报 quality_profile_version 建 QC 任务。'
      - '操作者/原因/来源无事件承载：audit_event 暂指 QC_TASK_QUEUED，因为恢复成功后产生的就是正常 QUEUED 事实；但 C7-6 要求的操作者与原因无处落。实现批次须新增独立事件或扩展载荷，那本身是一次契约修订，须另行登记，不得先实现后补契约。'
      - 'QC.TASK.ENQUEUE 的 implemented.route 登记为 POST /qc-tasks，与自动入队实际路径（relay 直调 service）不同源。本条目不改：implemented 台账要求 route 必须是真实 HTTP 端点，非 HTTP 入口无处登记，改它须先改闸门能力。这是既有的契约表达缺口，不是本批引入。'
