      ① result 收窄为单值 SUCCEEDED（迁移 f8a9b0c1d2e3）。建表时保留 FAILED 的理由是「将来多步重放
      不必改表」，但本实现的重放是单事务「锁行 → 条件清标记 → 写审计」，任何拒绝都在写之前以
      DomainError 发生，事务提交即全有、回滚即全无，FAILED 是任何路径都写不进去的值。保留它的代价
      不是多一个值，而是让读代码的人以为失败路径漏写了去补一条分支——而补不了：审计表 append-only，
      「先占位再改写终值」不可实现。为让一个枚举值可达而破坏 append-only，是把判据迁就枚举。
      ② 观测面补「重放次数」：outbox_dead_letter_replays_total{event_type}，只在提交成功之后 +1。
      台账原文说「没有重放次数 / 死信存量指标」，其中「死信存量」当时就已过时（outbox_relay_dead 早已
      存在），缺的只是处置动作的次数。口径写死：只计成功（拒绝路径的证据在结构化日志与 4xx 指标里），
      唯一标签 event_type（契约有限集），不打 operator（人员维度单调增长且不该用于阈值）。配告警
      OutboxDeadLettersPresent（outbox_relay_dead > 0 持续 30m，warning）：死信不会自愈。
      ③ 新增只读动作 OUTBOX.DEAD_LETTER.READ（GET /outbox/dead-letters）。只读独立席位：查询用于
      **定位**，重放才是**处置**，合并会让「只想看看有哪些死信」也必须持有处置权。只返回运维元数据
      （event_id / event_type / attempts / dead_lettered_at / occurred_at），不返回 payload——payload
      有业务数据与跨域引用，整批吐到运维列表等于把「可读运维元数据」放大成「可读业务事件内容」。
      键集分页 (dead_lettered_at, event_id) 倒序 + 游标而非 OFFSET：死信是正在被处置的队列，翻页
      期间行会消失，OFFSET 会因此漏行；只按时间做锚点则会在「同一时刻批量进死信」时跨页丢行。
      游标非法（含无时区时间）一律 422，不吞成空页——空页等于告诉运维「没有更多了」。
      配部分索引 ix_outbox_dead_letter（迁移 f9b0c1d2e3f4）：死信占全表极小比例，普通复合索引会让
      每次事件写入都为极少数行付维护代价；索引建在父表上，分区索引自动级联到已有与未来分区。
      同时 runbook 的手工 SQL 重放段落已删除并替换为端点调用——那段 SQL 不落任何审计，留着手册
      等于教人绕过 D6-9 的审计链。
