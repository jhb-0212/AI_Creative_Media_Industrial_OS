  - id: 'V205-R42-C7B-IMPL'
    title: 'C7-b 人工恢复入口实施——六项判据落地（A37 的 Owner 签署与实施记录）'
    retroactive: false
    recorded_at: '2026-11-24'
    discovered_by: 'docs/audits/2026-11-24-r42-authorization-reconciliation.md §11.1（Owner 签署）；docs/proposals/r42-remaining-acceptance-c7-d6.md §5（D-1/D-2/D-3 裁决）'
    reason: >-
      A37 只登记契约面，并按 P4 明确写了「签署缺失时只证明契约已登记，不证明实施已获批」。
      本条目是它的实施侧闭环，同时是签署事实的落纸处：Owner 于 2026-11-24 明确签署 A37，
      并采纳三项裁决（D-1 新增 QC.TASK.RECOVER、D-2 入口形态为受权 REST 端点、
      D-3 outbox.dead_letter_replays 不登记为契约对象）。签署后 C7-b 不再是「提议中的改造」，
      而是「已获批的实现批次」，本条目记录它落到了哪一步、哪几条判据可被机器判定。
      为什么另立条目而不回填 A37 的 approved_by：历史条目一旦落纸即冻结，事后改写会让
      「签署发生在何时」与「条目写于何时」无法区分，签署凭空获得追溯力；同理也不能把本批
      提交塞进 A37 的 source_commits——那条要指契约面提交 54aa49f，两段式登记的意义正是
      让「契约先于实现」这一步在历史里留下痕迹。所以 A37 正文一字不动，签署事实记在这里。
      实施要点（为什么是这些做法，而不是加校验）：
      ① 身份只取 Principal 的 QC.TASK.RECOVER 专项席位，请求体收敛为服务端可判定所需的
      三个字段（generation_task_id / project_id / reason，extra=forbid），asset_version_id 与
      quality_profile_version 再出现即 422——自报的事实不是事实；
      ② 归属与生命周期只取数据库：跨域读经中立端口（packages/shared/generation_ports.py）+
      生产域适配器 + 组合根装配，不给 qc_governance_role 补 production_planning 授权，
      那等于永久拆掉域边界；顺序固定为「读事实 → 授权 → 写」，因为归属判定对象只能是库里的
      project_id，且授权必须先于任何写入；
      ③ 幂等复用 uq_qc_governance_qc_tasks_generation_task，不新增幂等表或分布式锁；
      仓储 add() 由裸 flush 改为 SAVEPOINT + translate_write_error，23505 翻译成
      DuplicateEntityError → IDEMPOTENCY_CONFLICT(409)——原先并发重复投递会以 500 出现，
      relay 重试到死信，而入队其实早已成功，事实与响应相反；
      ④ 事件载荷补 source / operator_id / reason 并登记为 payload_required；EnqueueOrigin
      值对象取代散落的 created_by 字符串，MANUAL 必填 reason，构造期 fail-closed；
      ⑤ 闸门能力扩展而非为单个动作开豁免：implemented 台账新增 mechanism: in_process
      （强制 module + reason、不得同时声明 route、必须 ACTIVE，授权落点检查跳过它，
      因为其触发面由 outbox 事件与 relay 角色数据库权限决定，比 require_role 更硬），
      使「真的实现却无 HTTP 面」的自动入队不必再借用 POST /qc-tasks 的门牌号。
    adr: 'docs/adr/ADR-R42-asset-registration-saga.md'
