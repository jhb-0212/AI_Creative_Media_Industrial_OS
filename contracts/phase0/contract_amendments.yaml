  - id: 'V205-R42-C7B'
    title: 'C7 人工 QC 入队恢复入口的专项席位与来源核验（ADR-R42 C7 实现补齐）'
    retroactive: false
    recorded_at: '2026-11-24'
    discovered_by: '2026-11-24 外部代码审查报告（基线 dadbb17c）§六 C7 遗留；docs/audits/2026-11-24-r42-authorization-reconciliation.md §4.1；docs/proposals/r42-remaining-acceptance-c7-d6.md §1'
    reason: >-
      C7-b 不是新需求，而是契约违约。action_registry.yaml 早在 QC.TASK.ENQUEUE 上写死两条约束：
      「仅在生成终态且携带产物引用时入队」「同一生成任务不得重复入队」。运行时的 POST /qc-tasks
      两条都没做——project_id 与 quality_profile_version 直接取自请求体，既不核验任务是否终态、
      是否携带已登记产物引用，也不核验项目/租户归属；同时该端点对「生成 Worker/受信调度服务」
      与人工操作者不区分席位，使人工路径可以绕开 C7（只消费登记完成事件）与 C4（口径创建时冻结）。
      契约里早于实现写明的 negative_test_id ACT-QC-NEG-002 一直没有对应真实用例：tests/permission
      自述「仅校验契约本身，不依赖运行时」，所以「有编号」长期被误当成「有测试」。
      补齐方式是新增独立动作 QC.TASK.RECOVER 承载人工恢复，而不是放宽 QC.TASK.ENQUEUE 的席位：
      后者的席位本就是自动入队主体，改宽会让自动路径的最小权限一起放宽；且自动入队实际不经 HTTP
      （GENERATION_SUCCEEDED → relay 直调 QCTaskService），与「HTTP 端点」本就不同源，
      把两个主体塞进一个动作正是错位的来源。拆开之后每条约束各自可判，人工入口也能单独赋权与审计。
      幂等事实不新建机制：uq_qc_governance_qc_tasks_generation_task UNIQUE(generation_task_id)
      已在库层保证「同一生成任务至多一个有效 QC 任务」，自动路径已用它做并发兜底；人工入口接入
      同一唯一键即可，再加幂等表或分布式锁属于为满足判据叠加重复层。
      跨域归属核验不能同 Session：qc_governance_role 对 production_planning 无任何表授权，
      须按域各开连接（复用既有的 production_planning 租户 UoW），不能以请求体字段替代权威事实。
      本条目只登记契约面，实现批次须在 Owner 正式签署后启动——按 P4「不得以建议或合并替代授权」，
      2026-11-24 的六项判据属工程审查基线，不是签署。
    adr: 'docs/adr/ADR-R42-asset-registration-saga.md'
    approved_by: '工程审查建议（2026-11-24 S2 裁决：保留端点 + 补来源核验，六项判据 C7-1~C7-6，载于 docs/proposals/r42-remaining-acceptance-c7-d6.md）；Owner 正式签署待补，签署前不得进入实现批次'
