  - id: 'V205-R14-A8'
    title: '场次对象契约——Scene（归属锚点建模 + 引用目标闸门 + 枚举覆盖闸门）'
    retroactive: false
    recorded_at: '2026-11-18'
    discovered_by: 'V205-R14-A7 残余风险第 5 条（Scene 仍未建模）；项目所有者 2026-11-18 裁决要求数据库以 FOREIGN KEY (project_id, scene_id) REFERENCES scene(project_id, scene_id) 锁死归属'
    reason: >-
      Shot.scene_id 与 ShotRevision.scene_id 一直指向 Scene，而 Scene 没有任何 schema——三闸门却全绿。
      根因不是「忘了写」，而是没有任何机制能发现它被忘了：既有闸门只校验 action_registry.resource_type
      引用的类型，字段级「对象指向对象」从未被检查；resource_schema_gaps.yaml 也只按 resource_type 记账，
      所以 Scene 连「缺口」都不是，是「不存在」。只补一个 schema 只解决前一半，后一半会在下一个对象上重演
      （GateInstance、AuditEvent 已经排队），故本修订同时新增引用目标闸门。
      字段边界按「不猜契约」执行：正文对 Scene 只有 8.1 的层级关系一句话，没有任何字段表，因此只建模身份
      （scene_id）、业务编号（scene_code，8.2 仅用于展示 + 8.3 的 SC003 证据）、归属（episode_id）与作用域
      （project_id，复合外键成员列）+ C.3.1 十项信封；场次名/地点/日夜/目标/进出状态一律不进本对象，它们已有落点
      （ShotBreakdownDraft.scene_breakdowns[]）。状态集镜像 Episode（DRAFT/ACTIVE/ARCHIVED），理由不是照抄，
      而是同层级聚合不各造一套命名；同时拒绝裸 string——C.3.1 要求未知枚举值必须拒绝，裸 string 等于任何值都接受。
      Scene 作为新对象从第一天就用 additionalProperties=false，使「内容不越权」成为真正的 SCHEMA 级不变量。
      另外补登 enum_registry 缺失的 Project / Episode / ScriptRevision 三条（实测状态机 41 vs 枚举 38，
      派生文件早已与权威源脱钩），并新增枚举覆盖闸门防止下次再漏。
    adr: 'docs/adr/ADR-R19-scene-entity-contract.md'
    approved_by: '项目所有者（会话内指令「按你的来」，授权按上一轮建议顺序继续推进未闭合项，首项为 Scene 对象契约）'
