# 契约修订登记（Phase 0 冻结后的唯一合法变更入口）
#
# 为什么需要这个文件
# ----------------
# 基线 V2.0.5 冻结时 Action=75 / OpenAPI=75 / Schema=76 / 状态机=35。
# 此后为 Phase 1 主链增加了 6 个 Action、3 个对象、3 个状态机——这些增量本身
# 是业务需要的，但**没有任何一条走过修订流程**：派生文件被直接改，
# 冻结清单没有重新生成，于是出现「contract_check 内部 81↔81 自洽通过，
# 却无法证明仍符合 V2.0.5」的局面（第三轮审查 F1）。
#
# 本文件补的就是这条断掉的权威链：
#
#   V2.0.5 主文档（权威源，哈希见 frozen_inventory.yaml）
#          +
#   本文件登记的已批准修订
#          ↓
#   当前契约全集（必须逐名称精确等于「基线 ∪ 修订」）
#
# 它不引入第二套事实源：基线名称全集在 frozen_inventory.yaml，
# 本文件只登记「相对基线的增删及其理由」，判定逻辑唯一实现在
# scripts/freeze_manifest.py。
#
# 写入口径（违反即闸门报红）
# ------------------------
# 1. 新增/删除任何 Action、Schema 对象、状态机，必须先改基线文档（新修订）
#    或在此登记修订，再改派生文件；顺序反了就是「先斩后奏」，闸门会拦住。
# 2. 每条修订必须给：id、title、reason、adr、source_commits、approved_by、
#    approved_at，缺一项即 FAIL（债务不能含糊）。
# 3. 修订只能追加，不得改写历史条目；撤销一条修订用新的 `revocations` 记录，
#    保留原始痕迹。
# 4. 补登记（retroactive: true）必须如实标注——事后追认不等于当时合规，
#    记录里要写清「何时发现、由哪一轮审查发现」。
#
# 禁止事项
# --------
# - 不得为了让闸门变绿而把实际增量删掉（会破坏已上线的读写接口）；
# - 不得把「未实现」的契约登记为已批准修订来凑数；
# - 不得在此文件里写授权规则/角色/预算口径（那些归 permission_matrix.yaml）。

schema_version: '1.0'
