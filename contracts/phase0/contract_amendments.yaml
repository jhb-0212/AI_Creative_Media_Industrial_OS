    reason: >-
      本条目是 §9.4「关闭 P2 的最小动作」的执行结果，只补授权凭据，不改任何契约内容。
      为什么必须是 retroactive: true——两项实施（02a94c2）早于本授权一天落地，按台账第 34 行
      的纪律「事后追认不等于当时合规」，必须如实标注，不能回填成当时的授权。
      为什么另立条目而不改 A36 的 approved_by——A36 正文与「继承 A35」的记载是历史事实，
      改写它会让「授权发生在何时」与「条目写于何时」无法区分；同理不能把 02a94c2 塞进
      A35/A36 的 source_commits，那两条指向各自的落地提交。所以 A36 一字未动，
      读台账时须把本条与 A36 合并读，否则会误以为 A36 的授权范围本就包含这两项。
      为什么只授两项而不整批追认 PR-G——PR-G-1（PREPARED 恢复）已有 A35 的 C2 明文授权，
      PR-G-4 是文档对账，都不缺授权凭据；缺的只有两项，追认必须窄到缺口本身，
      否则一次签字会把「已授权事项」也重新签一遍，反而模糊了原先的授权边界。
      追认的技术理由（Owner 2026-11-25 裁决）：① media_type 与 locator、sha256 一起构成
      产物身份，必须是 T0 持久化事实；受控扩展名映射可确定性回填，无法映射时 NOT NULL
      收紧失败而非猜测填充，符合 fail-closed。② ABANDONED 语义受限：仅 PREPARED 可放弃、
      归属 GENERATION_PROCESS_ACTION、须带审计引用、保留原意图行、STORED_VERIFIED 不得放弃，
      存储暂时不可用不会被误判为放弃。③ 撤销这两项不是「删两个字段和一个枚举值」，
      而要重设恢复期的媒体类型事实与失败意图终态，会破坏 PR-G 恢复链条的一致性。
      边界（写死，不外扩）：不授权未来同类字段/状态的扩充，不扩大到整个 PR-G，
      不重复授权 C7-b 与 D6-9。
      本条目不改变 [V-BLOCKED]：追认只关闭「授权证据缺口」，技术验收是否通过属另一件事，
      须另行复核（代码、契约派生、迁移升降级、真实 PostgreSQL、恢复故障场景）后才可解除。
