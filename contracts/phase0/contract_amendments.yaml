      - 'A15 的「归档之后仍可在其下新增镜头」：已由 Lifecycle.frozen_states + 四条创建路径接线关闭，对应条目自 A15 residual_risks 删除'
    residual_risks:
      - '冻结判定依赖父行锁（FOR SHARE）才能并发正确：四条创建路径都先取父行锁再判定，加锁顺序固定为 Project → Episode → Scene。该顺序当前无自动判据，靠评审与本 ADR 约束'
