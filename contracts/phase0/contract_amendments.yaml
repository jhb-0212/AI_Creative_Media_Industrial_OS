      schema_objects:
        - object: 'Scene'
          why: '场次聚合根；是 Shot.scene_id / ShotRevision.scene_id 的引用目标与复合外键 (project_id, scene_id) 的被引用对象。14 属性 / 14 必填，additionalProperties=false'
      state_machines:
        - object: 'Scene'
          why: 'DRAFT→ACTIVE / ACTIVE→ARCHIVED / DRAFT→ARCHIVED，ARCHIVED 终态；状态集镜像 Episode（source_kind: derived_from_parent_lifecycle），非正文原文'
