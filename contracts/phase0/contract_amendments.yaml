  - id: 'V205-R14-A19'
    title: '归档即冻结子集合——四条创建路径接线、两条寻址线合一、闸门完备性判据'
    retroactive: false
    recorded_at: '2026-11-21'
    discovered_by: >-
      A15 residual_risks 的最后一条（「归档之后仍可在其下新增镜头」）经所有者裁定
      「写进契约」后，核对全部创建路径发现这是三层同构的缺口而非一处：EPISODE.CREATE
      （父 Project）、SCENE.CREATE（父 Episode）、SCRIPT.IMPORT（父 Episode）、
      SHOT.DRAFT.CONFIRM（父 Scene）四条路径没有一条看父对象状态。进一步核对发现
      SCENE.CREATE 的 A13 正式链（episode_id 寻址）注释声称「父链冻结与组织隔离由
      数据库守卫/RLS 承担」，而库中既无触发器也无带状态谓词的 RLS 策略——那句话
      没有对应物，是文档说有、实际没有的缺口形态。
    reason: >-
      「归档即冻结子集合」不是四条 if，而是状态语义：它说的是 Project / Episode /
      Scene 处于某状态时的性质。因此落点是 Lifecycle.frozen_states（A16 已引入）
      加上「判定从状态派生」，而不是在调用点写四个 if——手写分支只覆盖作者当时
      想到的那条路径，第五张子表接入时不会让任何闸门变红。

      本次补齐三件事：
      ① SCENE.CREATE 的两条寻址线合一：A13 正式链此前只校验集数归属、把冻结
      推给不存在的库层守卫。现在两条线都走 Project → Episode 带锁读 + 逐级
      assert_child_creation_allowed。固定锁序与归属治理线一致，否则两条线互相
      死锁。正式链需两跳读（先按 entity_id 探业务键、再按 (project_id, episode_ref)
      带锁读），前提是 ux_episode_ref_per_project 保证业务键项目内唯一，已核实。
      ② SHOT.DRAFT.CONFIRM 在**建行之前**一次性按 scene_id 全序锁定全部父场次并
      判冻结。排序是为了消除等待环（环只可能由顺序不一致产生）；一次性是为了
      避免「锁了 A、去锁 B 时 A 已变」的窗口——那种半串行化比不加锁更危险。
      ③ 守卫依赖从「可选 + 运行期 fail-closed」改为构造期必需。原先 shot_repository
      / project_repository 可缺省，靠调用点 if None: raise 兜底；这种写法防不住真正
      的失效模式——生产装配漏传时构造照常成功，直到某次归档或登记才在运行期 500。
      本轮就抓到了这个实例：装配点确实没传 project_repository，改完即刻全路径失败。
      改为必需后「构造成功 ⇒ 两个不变量都有执行者」成为类型系统前提。
      ④ 闸门新增 check_child_creation_freeze_coverage()：从 ORM metadata 派生
      「有子表引用的父表」全集，要求每张父表要么映射到声明了 frozen_states 的
      Lifecycle，要么在豁免表里写明理由；三向完备性（未登记→红、登记不存在→红、
      豁免已无子表引用→红）。应检集合按 schema 过滤，不随 import 顺序变化——
      同一判据在不同入口下给出不同结果是最糟的判据形态。

      未新增动作/对象/状态机，计数不变。SC-5 的定级（RUNTIME_ENFORCED）不变，
      本次补的是它另一侧的强制。
    adr: 'docs/adr/ADR-R28-scene-shot-rework-runtime-entry.md'
    approved_by: '项目所有者（2026-11-21 会话内裁定「归档即冻结子集合写进契约」，并选择继续做完而非回滚）'
    approved_at: '2026-11-21'
