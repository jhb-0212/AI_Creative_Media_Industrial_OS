    recorded_at: '2026-11-21'
    discovered_by: >-
      A19 residual_risks 的第一条：Project 的 frozen_states 含 COMPLETED，是否应冻结属
      语义裁定；并明确指出「闸门不会替你发现这个判断变化，它只检查有没有声明」。
      所有者以「按最优的来」授权按最优方案处置，不再停留在待确认状态。
    reason: >-
      裁定一：COMPLETED 继续冻结子集合（不移出元组）。理由不是偏好，而是转移图上的
      事实——Project 从 COMPLETED 只有一条出边（→ARCHIVED），没有任何回到 ACTIVE /
      DRAFT 的路。因此在该状态下登记的子对象会合法落库，却永远无法伴随父对象回到可
      推进的状态；而 COMPLETED 同时是「交付范围已固化」的事实，事后追加会改写已成立
      的交付记录，且不留任何状态变更痕迹。反过来，「交付后补录」这个需求也不该靠把
      COMPLETED 移出冻结集来实现：那会让补录绕过状态变更事实与审计。正确路径是另行
      登记重开边（COMPLETED→ACTIVE）与专属动作，让补录以一次可审计的状态变更开始；
      当前契约未登记该边，故本项目尚不支持该流程，冻结不减少任何已支持的能力。

      裁定二：把冻结策略搬进契约（state_machines.yaml 每个已实现对象的 frozen_states）。
      在此之前它是唯一不受契约治理的生命周期事实：改一行元组就能让归档项目重新接受
      新集数，而四道闸门全绿——A19 的覆盖判据只回答「有没有声明」，不回答「声明的是
      哪几个状态」。搬迁后，判断变化有三处可见痕迹：代码与契约不一致→新增判据
      check_frozen_state_contract() 红；契约文件哈希变化→freeze_manifest --check 红；
      重新签清单→需要一条已批准的修订登记。三步都要求人看见「冻结语义变了」，而不是
      让一行 diff 混在别的改动里。

      「没声明」与「声明为空」在运行期同形，因此 9 个已实现对象一律显式写出该字段
      （不冻结写 []），并由判据双向比对（缺失→红、未声明状态→红、重复→红、两侧集合
      不等→红、有 Lifecycle 未登记→红）。未新增动作/对象/状态机，计数不变。
    adr: 'docs/adr/ADR-R28-scene-shot-rework-runtime-entry.md'
    approved_by: '项目所有者（2026-11-21 会话内「按最优的来」授权按最优方案处置 A19 剩余语义裁定）'
