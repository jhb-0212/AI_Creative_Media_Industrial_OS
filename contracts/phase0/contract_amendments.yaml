      - '`media_type` 回填按小写扩展名精确匹配（SQL 的 LIKE 区分大小写）且只覆盖 7 种受控类型；历史数据若含 .gif / .mov / .PNG 等，该行保持 NULL，随后 ALTER COLUMN … NOT NULL 失败。fail-closed 成立，但报错只是 NOT NULL 违例、不指出具体 locator，排障需人工比对全表。'
