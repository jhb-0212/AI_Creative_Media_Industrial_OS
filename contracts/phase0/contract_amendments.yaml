  - id: 'V205-R42-D69'
    title: 'D6-9 受权死信重放的契约登记（OUTBOX.DEAD_LETTER.REPLAY）'
    retroactive: false
    recorded_at: '2026-11-24'
    discovered_by: 'ADR-R42 D6 表第 9 行（死信与人工处置）；docs/audits/2026-11-24-r42-authorization-reconciliation.md §4.2/§8.3/§11.2；docs/proposals/r42-remaining-acceptance-c7-d6.md §3（八项判据）'
    reason: >-
      D6-9 的需求早已授权（ADR-R42 D6 表第 9 行要求「多次重试仍无法恢复 → 死信与人工处置」），
      未裁决的只是实现方案。2026-11-24 Owner 裁决 D-2「入口形态取受权 REST 端点」、
      D-3「运维台账 dead_letter_replays 不登记为契约对象」，并指示开始实施。
      本条目登记这次实施所必需的契约面：新增动作 OUTBOX.DEAD_LETTER.REPLAY（actions 106→107）。
      为什么必须先登记再实施：死信「可人工重放」这句话此前只存在于
      workers/relay/consumer.py 的三处注释里——注释声明能力、代码没有入口，
      读者据此会误判运维可行性。契约先行让缺口第一次可被机器判定（not_implemented
      带 reason），实施随后的提交再把它改成 implemented；两段分开，谁批准了什么、
      什么时候做到哪一步，都能从历史里读出来。
      三处刻意的表达选择：
      ① resource_type 写 OutboxEvent 并在 resource_schema_gaps 登记债务，而不是给
