# [V-BLOCKED] 阻塞事项清单（机器可查的单一事实源）
#
# 为什么要有这个文件
# ----------------
# 「解除一条 [V-BLOCKED]」此前要在 4 处手改指针：台账条目、复核记录、对账记录、
# PR 描述。改漏一处不会报错，只会让下一个人读到旧状态；而「还有哪些阻塞在挡
# 什么」这个问题，此前唯一的答案是 grep 五份审计文档再靠人脑合并。合并的成本
# 不高，合错的可能性很高——尤其当历史条目按 append-only 纪律冻结不改时，
# 同一事项在文档里同时存在「当时阻塞」与「后来解除」两种原文。
#
# 本文件回答且只回答一个问题：**此刻哪些 [V-BLOCKED] 仍然成立，依据分别是什么。**
#
# 边界（刻意不收什么）
# ----------------
# 1. 只收审计记录里明确标注 `[V-BLOCKED]` 的事项。复核记录 §5 的五项差额
#    （audit_ref 无非空校验 / artifact_manifests 非 append-only / 状态机条目
#    PENDING_PHASE1_REVIEW / CI 往返深度 / 偶发 ACL 红灯）是**挂账**不是
#    [V-BLOCKED]，留在 docs/audits/2026-11-25-p2-release-review.md §5，不收进来：
#    把它们混进来会让「阻塞」这个词同时指两件事，清单就失去判据价值。
# 2. 不复制文档正文。`gap` 只写「现在缺什么」，论证与证据留在原文，靠
#    `evidence` 指路。复制正文等于制造第二份会漂移的叙述。
# 3. 不代替裁决。`status: BLOCKED` 的意思是「还在等一个决定」，不是
#    「本文件的作者认为应该怎么做」。
#
# 状态语义：LIFTED 不是一个状态，是一对（`lifted_scope` + `remaining_gate`）
# ----------------------------------------------------------------------
# 2026-11-25 的教训：TC-1~TC-5 的裁决 2026-11-23 就签了，清单却仍记「等 Owner
# 裁定其一」，于是「还有 7 条阻塞」这个当前状态错了两天。根因不是忘了改状态，
# 而是**清单把「决策阻塞」与「执行门槛」压在同一条 gap 里**——一旦拆不开，
# 解除时要么不敢改，要么一改就变成「整件事都放行了」，两种错都很贵。
#
# 所以 LIFTED 必须说清解除到哪一层：
#   * `lifted_scope: ALL`       —— 该阻塞所缺的东西全部补齐（如 P2：追认 + 技术复核）。
#   * `lifted_scope: DECISION`  —— 决策层已解除，执行层仍受限，必须带 `remaining_gate`。
# 判据强制这两者的搭配：DECISION 缺 remaining_gate 报红（解除会被读成放行）；
# ALL 带 remaining_gate 也报红（那就不是全解除，状态在自相矛盾）。
#
# `remaining_gate` 是**索引不是权威**：`source` 指向权威条款（如 ADR-R44 §4 的
# 「执行约束」栏）。清单不复制裁决正文——复制出来的第二份叙述必然漂移。
#
# 校验（scripts/verification_blocks.py --check，已接入 contract_check）
# ----------------------------------------------------------------
# * id 唯一；status ∈ {BLOCKED, LIFTED}；计数字段与实际条目一致；
# * `raised_by` / `evidence` / `lift_evidence` 指向的文件必须存在；
# * `lifted_by` 必须是 contract_amendments.yaml 里真实存在的修订 id，
#   且 `lift_evidence` 文档里必须提到这个 id —— 两处指针互为凭据，
#   只写其中一处会得出「已解除但找不到裁决」或「有裁决但没记录」；
# * LIFTED 必须有 lifted_at 与 lifted_scope；BLOCKED 不得带任何 lifted_* /
#   remaining_gate 字段（状态含糊即报红）；
# * `reference_baseline`（可选）：凡在 title/gap 里写「引用 N 处」的条目，必须给出
#   `as_of_commit` + `command` + `matched_lines` + `files`。理由是这类计数随审计
#   增长单调上升（记录这件事本身也会让它 +1），裸数字必然漂移成一个假断言。
