# 冻结附件（治理文件）：冻结结论所依据的决议/签署件。
#
# 与上面 baseline 的区别：baseline 是「被冻结的契约基线」，附件是「决定冻结这件事
# 的那份文件」。它不进十一类产物（那会把 31.11 的十一类变成十二类，并让名称全集
# 判定开始吃进非契约文件），但字节与哈希必须可复核——依据被替换而清单仍绿，
# 是最没有意义的一种绿。
#
# 只由人类修订流程改动；删掉一条登记等于宣称「冻结不再需要该依据」，
# 须有裁决，不能靠改这个文件完成。
attachments:
  - path: 'docs/baseline/Phase0-冻结评审决议.md'
    bytes: 21327
    sha256: '05eb0c99385426ae7405c05aa908eb9fd0685b83853f7831b713594182f30aab'
    role: 'Phase 0 契约冻结决议（AFS-P0-FREEZE-2026-11-13-01，2026-11-13，项目 owner 签署）'
    note: >-
      本件证明的是「冻结这件事被告过」，不等于「当时封存的那一版基线还能复核」：
      决议自称评审对象为 468816 字节 / sha256 66ec66d8… 的基线，该文件在本机与 git
      全历史中均已不存在（历史里最接近 490050 字节的 R14 副本与 489580 字节的 R15
      基线）。故 2026-11-13 的冻结哈希链无法重算，此处只锁「决议正文未变」。

