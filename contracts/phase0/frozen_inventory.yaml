# Phase 0 冻结基线清单（V205-R15）
#
# 本文件是「冻结时刻的名称全集」，不是派生视图。
# 作用：让 freeze_manifest.py 能判定「当前契约 == 基线 + 已批准修订」，
# 从而把「静默新增 Action/Schema」与「正常演进」区分开。
#
# 只由人类修订流程改动（见 contracts/phase0/contract_amendments.yaml 的写入口径），
# 生成器与运行时都不得改写本文件。
#
# 来源：基线文档 31.6 Action Registry / 8.x 对象契约 / 31.5 状态机，
# 冻结时刻的仓库快照为 dfc5bd8（message: 初始化仓库骨架与 Phase 0 冻结契约）。

