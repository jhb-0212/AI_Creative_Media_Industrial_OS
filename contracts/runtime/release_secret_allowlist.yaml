# 发布包密钥扫描误报放行清单。
#
# 放行必须满足三要素：path + rule_id + fingerprint + reason。
# fingerprint 是命中值的 SHA-256 前 12 位，不含明文；同一值换位置仍需重新登记。
# 这里只允许「已确认的测试夹具 / 文档示例」，生产配置一律不得放行。
schema_version: 1
entries:
  - path: tests/unit/test_config_secrets.py
    rule_id: private_key_block
    fingerprint: 3021d90eb943
    reason: >-
      单元测试内联的 PEM 头字符串，用于验证 API 进程拒绝持有签发私钥；
      不含 key body，也不是可用于签发的私钥。
  - path: tests/unit/test_identity_private_key_boundary.py
    rule_id: private_key_block
    fingerprint: 3021d90eb943
    reason: >-
      私钥边界单测的夹具头字符串，用于验证配置层/入口层 fail-closed；
      常量在测试断言中公开出现，不是运行时密钥。
  - path: tests/unit/test_release_package.py
    rule_id: private_key_block
    fingerprint: 3021d90eb943
    reason: >-
      发布治理单测中的 PEM 头字面量，用于证明扫描器能识别私钥块；
      只含 header，无 key body，不是可签发密钥。
  - path: tests/unit/test_release_package.py
    rule_id: aws_access_key_id
    fingerprint: 743554670c60
    reason: >-
      发布治理单测中的 AWS key 形态夹具，用于验证识别规则与 allowlist 精确匹配；
      值为固定测试串，不对应任何真实账号。
  - path: tests/unit/test_release_package.py
    rule_id: assigned_credential
    fingerprint: 743554670c60
    reason: >-
      同一 AWS 形态夹具在赋值语句中会同时命中通用赋值规则；
      已与上一条共享同一测试串，按规则 ID 分别登记。
  - path: tests/unit/test_release_package.py
    rule_id: openai_api_key
    fingerprint: 9f979e7d0335
    reason: >-
      发布治理单测中写入临时 `.env` 的假 key，用于证明未跟踪文件不进归档；
      临时仓库在测试结束后销毁，值不对应任何真实服务。
