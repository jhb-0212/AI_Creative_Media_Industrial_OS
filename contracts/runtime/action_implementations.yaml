# 运行时实现台账（Runtime Implementation Ledger）
#
# 为什么需要它：
# - contracts/action_registry.yaml 与 contracts/openapi/openapi.draft.yaml 是同一份
#   契约的两种视图，两份互相一致只能证明「文档自洽」，不能证明「平台真能执行」。
# - 之前 36 个 status=ACTIVE 的 action 里，运行时只有 8 个端点，contract_check 全绿。
#   缺口不可见 = 缺口一定会扩大。
#
# 这份台账把缺口显式化：每个 ACTIVE action 必须落在 implemented 或 not_implemented
# 之一，且 implemented 里写的 route 由 contract_check **真实加载 app.openapi() 校验**
# 存在性——所以声明无法撒谎，列表也不能悄悄过期。
#
# 维护规则：
# 1. implemented.route 必须写成 "METHOD /path"，路径与运行时 app 的 path 完全一致；
# 2. not_implemented 必须写 reason（给下一个人看，不是给 CI 看）；
# 3. PHASE_GATED 的 action 不进本台账（它们不要求实现，提了反而制造口径混乱）；
# 4. 新增运行时端点必须同时在这里登记，否则 contract_check 报「未登记端点」。
version: 1

implemented:
  PROJECT.CREATE:
    route: "POST /projects"
    module: services/project_planning/api/project_routes.py
  PROJECT.READ:
    route: "GET /projects/{entity_id}"
    module: services/project_planning/api/project_routes.py
  EPISODE.CREATE:
    route: "POST /episodes"
    module: services/project_planning/api/episode_routes.py
  EPISODE.READ:
    route: "GET /episodes/{entity_id}"
    module: services/project_planning/api/episode_routes.py
  SCRIPT.IMPORT:
    route: "POST /scripts/import"
    module: services/project_planning/api/script_routes.py
  SCRIPT.LOCK.REQUEST:
    route: "POST /scripts/{entity_id}/lock/request"
    module: services/project_planning/api/script_routes.py
  SCRIPT.LOCK.APPROVE:
    route: "POST /scripts/{entity_id}/lock/approve"
    module: services/project_planning/api/script_routes.py
  SCRIPT.READ:
    route: "GET /scripts/{entity_id}"
    module: services/project_planning/api/script_routes.py
  # --- 资产域（AssetVersion / QCReport）---
  ASSET.VERSION.CREATE:
    route: "POST /assets"
    module: services/asset_service/api/asset_routes.py
  QC.REPORT.CREATE:
    route: "POST /assets/{asset_version_id}/qc-reports"
    module: services/asset_service/api/asset_routes.py
  ASSET.VERSION.APPROVE:
    route: "POST /assets/{asset_version_id}/approve"
    module: services/asset_service/api/asset_routes.py

