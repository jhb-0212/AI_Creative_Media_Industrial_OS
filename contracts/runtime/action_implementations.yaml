# 运行时实现台账（Runtime Implementation Ledger）
#
# 为什么需要它：
# - contracts/action_registry.yaml 与 contracts/openapi/openapi.draft.yaml 是同一份
#   契约的两种视图，两份互相一致只能证明「文档自洽」，不能证明「平台真能执行」。
# - 之前 36 个 status=ACTIVE 的 action 里，运行时只有 8 个端点，contract_check 全绿。
#   缺口不可见 = 缺口一定会扩大。
#
# 这份台账把缺口显式化：每个 ACTIVE action 必须落在 implemented 或 not_implemented
# 之一，且 implemented 里写的 route 由 contract_check **真实加载 app.openapi() 校验**
# 存在性——所以声明无法撒谎，列表也不能悄悄过期。
#
# 维护规则：
# 1. implemented.route 必须写成 "METHOD /path"，路径与运行时 app 的 path 完全一致；
# 2. not_implemented 必须写 reason（给下一个人看，不是给 CI 看）；
# 3. PHASE_GATED 的 action 不进本台账（它们不要求实现，提了反而制造口径混乱）；
# 4. 新增运行时端点必须同时在这里登记，否则 contract_check 报「未登记端点」。
version: 1

implemented:
  PROJECT.CREATE:
    route: "POST /projects"
    module: services/project_planning/api/project_routes.py
  PROJECT.READ:
    route: "GET /projects/{entity_id}"
    module: services/project_planning/api/project_routes.py
  EPISODE.CREATE:
    route: "POST /episodes"
    module: services/project_planning/api/episode_routes.py
  EPISODE.READ:
    route: "GET /episodes/{entity_id}"
    module: services/project_planning/api/episode_routes.py
  SCRIPT.IMPORT:
    route: "POST /scripts/import"
    module: services/project_planning/api/script_routes.py
  SCRIPT.LOCK.REQUEST:
    route: "POST /scripts/{entity_id}/lock/request"
    module: services/project_planning/api/script_routes.py
  SCRIPT.LOCK.APPROVE:
    route: "POST /scripts/{entity_id}/lock/approve"
    module: services/project_planning/api/script_routes.py
  SCRIPT.READ:
    route: "GET /scripts/{entity_id}"
    module: services/project_planning/api/script_routes.py
  # --- 资产域（AssetVersion / QCReport）---
  ASSET.VERSION.CREATE:
    route: "POST /assets"
    module: services/asset_service/api/asset_routes.py
  QC.REPORT.CREATE:
    route: "POST /assets/{asset_version_id}/qc-reports"
    module: services/asset_service/api/asset_routes.py
  ASSET.VERSION.APPROVE:
    route: "POST /assets/{asset_version_id}/approve"
    module: services/asset_service/api/asset_routes.py
  ASSET.VERSION.READ:
    route: "GET /assets/{asset_version_id}"
    module: services/asset_service/api/asset_routes.py
  # --- 交付域（DeliveryManifest）---
  # CREATE 只产出 DRAFT；RELEASE 放行已 VALIDATED 的不可变版本（D4）。
  # APPROVE 是联合审批（allowed_principals 含 +），授权层恒 fail-closed，
  # 无专用 HTTP 端点：发起走 WORKFLOW.START_APPROVAL，结论由 asset 域消费
  # APPROVAL_TICKET_COMPLETED 推进 VALIDATED（见 not_implemented 的原因）。
  DELIVERY.MANIFEST.CREATE:
    route: "POST /delivery-manifests"
    module: services/asset_service/api/delivery_routes.py
  DELIVERY.MANIFEST.RELEASE:
    route: "POST /delivery-manifests/{manifest_id}/release"
    module: services/asset_service/api/delivery_routes.py
  # --- 质量治理域（Gate 裁决，append-only）---
  PRODUCTION.GATE.APPROVE:
    route: "POST /gate-decisions"
    module: services/qc_governance/api/gate_routes.py
  # --- 通用审批引擎（新审批不再写业务专用 *.APPROVE 端点）---
  WORKFLOW.START_APPROVAL:
    route: "POST /approval-tickets"
    module: services/workflow/api/approval_routes.py
  WORKFLOW.SUBMIT_VOTE:
    route: "POST /approval-tickets/{ticket_id}/votes"
    module: services/workflow/api/approval_routes.py

# 以下 ACTIVE action 契约已启用、运行时尚未实现。每一项都是一条待排期的真实缺口。
not_implemented:
  # --- 镜头域（ShotDraft / ShotRevision / ShotSpec / ConstraintPack）---
  SHOT.DRAFT.CREATE:
    reason: "镜头域未落地；且 ShotDraft 在 object_schemas 中无定义（见 docs/adr/ADR-R07-shot-draft-contract-gap.md），实现前必须先补对象契约"
  SHOT.REVISION.CONFIRM:
    reason: "镜头域未落地；版本冲突拒绝需先有 ShotRevision 版本表"
  SHOTSPEC.LOCK:
    reason: "镜头域未落地；锁定维度/依据/审批事件依赖 ShotSpec 对象"
  CONSTRAINT.PACK.CREATE:
    reason: "镜头域未落地；ConstraintPack 的 NOT_APPLICABLE 语义需镜头上下文"
  CONSTRAINT.PACK.LOCK:
    reason: "镜头域未落地"
  # --- 生成与资产 ---
  PRODUCTION.ROUTE.SELECT:
    reason: "生产路线库（ProductionRoute）未建模；选路依据 rights/capability 尚不存在"
  GENERATION.REQUEST:
    reason: "生成任务表与预算/配额校验未落地；模型网关未接入"
  # --- 权利与 Canon ---
  CANON.CHANGE.APPROVE:
    reason: "CharacterCanon 未建模（services/rights_governance 为空壳）"
  RIGHTS.STATUS.CHANGE:
    reason: "权利案例/清单未建模；双人审批无落点"
  # --- 预算 ---
  BUDGET.SHOT.REQUEST:
    reason: "预算账本未落地（services/budget_quota 为空壳）"
  BUDGET.SHOT.APPROVE:
    reason: "预算账本未落地；QualityReserve 用途校验依赖账户模型"
  # --- 社区展示 ---
  SHOWCASE.SNAPSHOT.CREATE:
    reason: "展示快照未建模；精确版本引用需 AssetVersion 先存在"
  SHOWCASE.SNAPSHOT.REVOKE:
    reason: "展示快照未建模"
  SHOWCASE.SHARE.CREATE:
    reason: "分享链接未建模；有效期/水印/受众字段无落点"
  SHOWCASE.SHARE.REVOKE:
    reason: "分享链接未建模"
  COMMUNITY.REUSE.REQUEST:
    reason: "契约要求 Phase 1 人工申请通道；当前无申请单对象与受理流程"
  # --- 反推 / 客户审片 / 交付 ---
  REVERSE.ANALYSIS.CREATE:
    reason: "视频反推未接入（模型网关与媒资处理均未落地）"
  REVERSE.ANALYSIS.CONFIRM:
    reason: "视频反推未接入"
  CLIENT.REVIEW.CREATE:
    reason: "客户审片域未建模；Viewer 权限体系未落地"
  CLIENT.REVIEW.ANNOTATE:
    reason: "客户审片域未建模；批注需时间码与媒资播放器"
  DELIVERY.SPEC.APPROVE:
    reason: "交付规格未建模；职责分离需交付审核角色域"
  DELIVERY.MANIFEST.APPROVE:
    reason: "无专用 HTTP 端点（allowed_principals 含 + 恒 fail-closed，ADR-R11-G）：发起走 WORKFLOW.START_APPROVAL，投票走 WORKFLOW.SUBMIT_VOTE，结论由 DeliveryApprovalService 消费 outbox 的 APPROVAL_TICKET_COMPLETED 推进 VALIDATED（D4 / ADR-R24）。此处保持 not_implemented 是因为本动作没有以自身 key 命名的独立端点，不能登记一个不存在的 route。仍缺：PictureLock/权利证据对象的跨域存在性校验（Phase 1 主链未落地）"
