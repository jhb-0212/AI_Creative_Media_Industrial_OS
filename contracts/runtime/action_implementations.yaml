# 运行时实现台账（Runtime Implementation Ledger）
#
# 为什么需要它：
# - contracts/action_registry.yaml 与 contracts/openapi/openapi.draft.yaml 是同一份
#   契约的两种视图，两份互相一致只能证明「文档自洽」，不能证明「平台真能执行」。
# - 之前 36 个 status=ACTIVE 的 action 里，运行时只有 8 个端点，contract_check 全绿。
#   缺口不可见 = 缺口一定会扩大。
#
# 这份台账把缺口显式化：每个 ACTIVE action 必须落在 implemented 或 not_implemented
# 之一，且 implemented 里写的 route 由 contract_check **真实加载 app.openapi() 校验**
# 存在性——所以声明无法撒谎，列表也不能悄悄过期。
#
# 维护规则：
# 1. implemented.route 必须写成 "METHOD /path"，路径与运行时 app 的 path 完全一致；
# 2. not_implemented 必须写 reason（给下一个人看，不是给 CI 看）；
# 3. PHASE_GATED 的 action 不进本台账（它们不要求实现，提了反而制造口径混乱）；
# 4. 新增运行时端点必须同时在这里登记，否则 contract_check 报「未登记端点」。
version: 1

implemented:
  PROJECT.CREATE:
    route: "POST /projects"
    module: services/project_planning/api/project_routes.py
  PROJECT.READ:
    route: "GET /projects/{entity_id}"
    module: services/project_planning/api/project_routes.py
  PROJECT.STATUS.CHANGE:
    route: "POST /projects/{entity_id}/status"
    module: services/project_planning/api/project_routes.py
  EPISODE.CREATE:
    route: "POST /episodes"
    module: services/project_planning/api/episode_routes.py
  EPISODE.READ:
    route: "GET /episodes/{entity_id}"
    module: services/project_planning/api/episode_routes.py
  EPISODE.STATUS.CHANGE:
    route: "POST /episodes/{entity_id}/status"
    module: services/project_planning/api/episode_routes.py
  SCRIPT.IMPORT:
    route: "POST /scripts/import"
    module: services/project_planning/api/script_routes.py
  SCRIPT.LOCK.REQUEST:
    route: "POST /scripts/{entity_id}/lock/request"
    module: services/project_planning/api/script_routes.py
  SCRIPT.LOCK.APPROVE:
    route: "POST /scripts/{entity_id}/lock/approve"
    module: services/project_planning/api/script_routes.py
  SCRIPT.READ:
    route: "GET /scripts/{entity_id}"
    module: services/project_planning/api/script_routes.py
  # --- 资产域（AssetVersion / QCReport）---
  ASSET.VERSION.CREATE:
    route: "POST /assets"
    module: services/asset_service/api/asset_routes.py
  QC.REPORT.CREATE:
    route: "POST /assets/{asset_version_id}/qc-reports"
    module: services/asset_service/api/asset_routes.py
  ASSET.VERSION.APPROVE:
    route: "POST /assets/{asset_version_id}/approve"
    module: services/asset_service/api/asset_routes.py
  ASSET.VERSION.READ:
    route: "GET /assets/{asset_version_id}"
    module: services/asset_service/api/asset_routes.py
  ASSET.STATUS.CHANGE:
    route: "POST /assets/{asset_version_id}/status"
    module: services/asset_service/api/asset_routes.py
  # --- A13：Scene / Shot / ShotBreakdownDraft / ReworkTask（ADR-R40） ---
  # 注意 SHOT.REVISION.CONFIRM 与 SHOT.DRAFT.CONFIRM 共用同一端点：
  # 首次确认在同一事务里既落草案终态、又创建 Shot + 首个 ShotRevision，
  # 拆成两个端点会让「草案已确认但镜头没建」成为可能。
  SCENE.CREATE:
    route: "POST /scenes"
    module: services/project_planning/api/shot_planning_routes.py
  SCENE.READ:
    route: "GET /scenes/{entity_id}"
    module: services/project_planning/api/shot_planning_routes.py
  SCENE.STATUS.CHANGE:
    route: "POST /scenes/{entity_id}/status"
    module: services/project_planning/api/shot_planning_routes.py
  SHOT.READ:
    route: "GET /shots/{entity_id}"
    module: services/project_planning/api/shot_planning_routes.py
  SHOT.STATUS.CHANGE:
    route: "POST /shots/{entity_id}/status"
    module: services/project_planning/api/shot_planning_routes.py
  SHOT.DRAFT.CREATE:
    route: "POST /shot-drafts"
    module: services/project_planning/api/shot_planning_routes.py
  SHOT.DRAFT.READ:
    route: "GET /shot-drafts/{entity_id}"
    module: services/project_planning/api/shot_planning_routes.py
  SHOT.DRAFT.CONFIRM:
    route: "POST /shot-drafts/{entity_id}/confirm"
    module: services/project_planning/api/shot_planning_routes.py
  SHOT.REVISION.CONFIRM:
    route: "POST /shot-drafts/{entity_id}/confirm"
    module: services/project_planning/api/shot_planning_routes.py
  SHOT.DRAFT.RETURN:
    route: "POST /shot-drafts/{entity_id}/return"
    module: services/project_planning/api/shot_planning_routes.py
  SHOT.DRAFT.DISCARD:
    route: "POST /shot-drafts/{entity_id}/discard"
    module: services/project_planning/api/shot_planning_routes.py
  REWORK.TASK.CREATE:
    route: "POST /rework-tasks"
    module: services/project_planning/api/shot_planning_routes.py
  REWORK.TASK.READ:
    route: "GET /rework-tasks/{entity_id}"
    module: services/project_planning/api/shot_planning_routes.py
  REWORK.TASK.STATUS.CHANGE:
    route: "POST /rework-tasks/{entity_id}/status"
    module: services/project_planning/api/shot_planning_routes.py
  # --- A22：ShotSpec（DRAFT → LOCKED，唯一一条边归 SHOTSPEC.LOCK）---
  # 创建与锁定分成两个动作：LOCK 是 HIGH 风险审批动作，兼做创建等于把
  # 未经创建侧校验（绑定精确修订 + SS-3）的写入藏进审批里。
  SHOTSPEC.CREATE:
    route: "POST /shot-specs"
    module: services/project_planning/api/shot_planning_routes.py
  SHOTSPEC.READ:
    route: "GET /shot-specs/{entity_id}"
    module: services/project_planning/api/shot_planning_routes.py
  SHOTSPEC.LOCK:
    route: "POST /shot-specs/{entity_id}/lock"
    module: services/project_planning/api/shot_planning_routes.py
  # --- A23：ConstraintPack（DRAFT → ACTIVE 归 LOCK；三条治理边归 STATUS.CHANGE）---
  # 与 ShotSpec 同一条纪律：创建与生效分离。LOCK 兼做创建，等于把未经
  # 「作用镜头归属 + 七维度词表 + 条目八字段」校验的写入藏进审批动作里。
  CONSTRAINT.PACK.CREATE:
    route: "POST /constraint-packs"
    module: services/project_planning/api/shot_planning_routes.py
  CONSTRAINT.PACK.READ:
    route: "GET /constraint-packs/{entity_id}"
    module: services/project_planning/api/shot_planning_routes.py
  CONSTRAINT.PACK.LOCK:
    route: "POST /constraint-packs/{entity_id}/lock"
    module: services/project_planning/api/shot_planning_routes.py
  CONSTRAINT.PACK.STATUS.CHANGE:
    route: "POST /constraint-packs/{entity_id}/status"
    module: services/project_planning/api/shot_planning_routes.py
  # --- R16-D3：生产链与预算 MVP（6 动作补齐） ---
  PRODUCTION.ROUTE.SELECT:
    route: "POST /production-routes"
    module: services/production_planning/api/production_routes.py
    # 同一动作的第二个入口：撤销治理边（VERIFIED → REVOKED）在状态机里就归
    # PRODUCTION.ROUTE.SELECT 所有，因此共用同一条准入凭据，不另造动作键。
    extra_routes:
      - "POST /production-routes/{entity_id}/revoke"
  GENERATION.REQUEST:
    route: "POST /generation-tasks"
    module: services/production_planning/api/generation_routes.py
  PRODUCTION.GATE.APPROVE:
    route: "POST /gate-decisions"
    module: services/qc_governance/api/gate_routes.py
  BUDGET.SHOT.REQUEST:
    route: "POST /shot-budget-requests"
    module: services/budget_quota/api/budget_routes.py
  BUDGET.SHOT.APPROVE:
    route: "POST /shot-budget-requests/{entity_id}/approve"
    module: services/budget_quota/api/budget_routes.py

# 以下 ACTIVE action 契约已启用、运行时尚未实现。每一项都是一条待排期的真实缺口。
not_implemented:
  # --- 权利与 Canon ---
  CANON.CHANGE.APPROVE:
    reason: "CharacterCanon 未建模（services/rights_governance 为空壳）"
  RIGHTS.STATUS.CHANGE:
    reason: "权利案例/清单未建模；双人审批无落点"
  # --- 社区展示 ---
  SHOWCASE.SNAPSHOT.CREATE:
    reason: "展示快照未建模；精确版本引用需 AssetVersion 先存在"
  SHOWCASE.SNAPSHOT.REVOKE:
    reason: "展示快照未建模"
  SHOWCASE.SHARE.CREATE:
    reason: "分享链接未建模；有效期/水印/受众字段无落点"
  SHOWCASE.SHARE.REVOKE:
    reason: "分享链接未建模"
  COMMUNITY.REUSE.REQUEST:
    reason: "契约要求 Phase 1 人工申请通道；当前无申请单对象与受理流程"
  # --- 反推 / 客户审片 / 交付 ---
  REVERSE.ANALYSIS.CREATE:
    reason: "视频反推未接入（模型网关与媒资处理均未落地）"
  REVERSE.ANALYSIS.CONFIRM:
    reason: "视频反推未接入"
  CLIENT.REVIEW.CREATE:
    reason: "客户审片域未建模；Viewer 权限体系未落地"
  CLIENT.REVIEW.ANNOTATE:
    reason: "客户审片域未建模；批注需时间码与媒资播放器"
  DELIVERY.SPEC.APPROVE:
    reason: "交付规格未建模；职责分离需交付审核角色域"
  DELIVERY.MANIFEST.CREATE:
    reason: "交付清单未落地（Manifest 需可追溯、可校验、可重建三件套）"
  DELIVERY.MANIFEST.APPROVE:
    reason: "交付清单未落地"
  DELIVERY.MANIFEST.RELEASE:
    reason: "交付清单未落地"
