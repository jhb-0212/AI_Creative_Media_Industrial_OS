# 契约声明了、但运行时转移表尚未覆盖的状态（显式债务登记）
#
# 为什么需要这个文件：
# - 契约 state_machines.yaml 会列出全部状态（含旁支），但正文可能没有给出旁支的
#   来源边与前置条件。按 31.5「未登记转移一律拒绝」，实现不能凭空造边；于是这些
#   状态在运行时不可达。
# - 不可达本身不是错误，**静默不可达**才是错误。本文件把每个不可达状态连同
#   「卡在什么契约缺口」「什么条件解开」一起登记；闸门 check_state_reachability
#   会双向校验：未登记的不许不可达，登记了却已可达的（陈旧债务）同样报红。
#
# 写入口径：
# - 只登记当前实现了状态机（scripts/contract_check.py:_STATE_MACHINE_SOURCES）的对象；
# - 每个状态必须给 reason / contract_ref / unblocks_when 三项，缺一即契约错误；
# - 解开后要立刻删条目，否则闸门会以「陈旧债务」报红。

gaps:
  ApprovalTicket:
    CANCELLED:
      reason: "契约列出异常/失效 CANCELLED，但没有撤销审批的动作契约，不能凭空造边"
      contract_ref: "contracts/state_machines/state_machines.yaml:ApprovalTicket"
      unblocks_when: "契约新增 WORKFLOW.CANCEL_APPROVAL 动作并定义前置条件后补边并删本条目"
  AssetVersion:
    REJECTED:
      reason: "契约只写「可进入 REJECTED」，未给来源边与触发前置条件（拒绝需理由与证据）"
      contract_ref: "contracts/state_machines/state_machines.yaml:45-46"
      unblocks_when: "8.5 正文补登记来源边（预期形如 TECHNICAL_QC→REJECTED，携带 reject_reason 与证据引用）"
    QUARANTINED:
      reason: "契约只写「可进入 QUARANTINED」，未给来源边；且注明不得直接转 GOLD，须补齐证据并经授权复核"
      contract_ref: "contracts/state_machines/state_machines.yaml:45-46"
      unblocks_when: "正文补登记隔离来源边（预期来自权利/合规失败路径）与解除隔离的授权动作"
    REWORK:
      reason: "契约只写「可进入 REWORK」，未给来源边与返工准入（谁判返工、返工产物如何版本化）"
      contract_ref: "contracts/state_machines/state_machines.yaml:45-46"
      unblocks_when: "正文补登记返工来源边（预期 HUMAN_REVIEW→REWORK）与返工产物引用规则"
    SUPERSEDED:
      reason: "契约只写「可进入 SUPERSEDED」，未给来源边；版本被谁、在什么动作下取代未定义"
      contract_ref: "contracts/state_machines/state_machines.yaml:45-46"
      unblocks_when: "正文补登记取代来源边（预期 APPROVED→SUPERSEDED，携带新版本引用）"
    ARCHIVED:
      reason: "契约只写「可进入 ARCHIVED」，未给来源边与归档保留期口径"
      contract_ref: "contracts/state_machines/state_machines.yaml:45-46"
      unblocks_when: "正文补登记归档来源边与保留期（与 R06 Outbox 保留期策略对齐）"
  DeliveryManifest:
    INVALID:
      reason: "契约 31.5 只把 INVALID 列为异常态，未给来源边与判定前置条件；不能凭空造边"
      contract_ref: "contracts/state_machines/state_machines.yaml:DeliveryManifest"
      unblocks_when: "正文补登记 INVALID 的来源边（预期来自校验失败的交付动作）与判定依据后补边并删本条目"
    STALE:
      reason: "契约写「源或规格变化标记 STALE」，但未定义是哪个动作、以什么证据触发这条转移"
      contract_ref: "contracts/state_machines/state_machines.yaml:DeliveryManifest"
      unblocks_when: "正文补登记 STALE 的触发动作（预期 DELIVERY.MANIFEST.INVALIDATE）与源版本比对规则后补边"
    REVOKED:
      reason: "契约写「权利/安全撤销标记 REVOKED」，但撤销动作的契约与授权主体尚未定义"
      contract_ref: "contracts/state_machines/state_machines.yaml:DeliveryManifest"
      unblocks_when: "正文补登记 REVOKED 的触发动作（预期 CREATOR.RELEASE.REVOKE 的同族交付动作）后补边"
    SUPERSEDED:
      reason: "契约只列 SUPERSEDED 为失效态，未给取代来源边与新版本引用规则"
      contract_ref: "contracts/state_machines/state_machines.yaml:DeliveryManifest"
      unblocks_when: "正文补登记取代来源边（预期 VALIDATED→SUPERSEDED，携带新 manifest_id）后补边"

# 已实现状态机的「转移无 HTTP 入口」债务（与上面的 gaps 区分语义）：
# - gaps 登记的是「状态在域转移表中不可达」（缺来源边）；
# - transition_entry_gaps 登记的是「状态可达、但没有任何 action 能触发这条转移」
#   （缺状态变更入口）。两者都是「绿着但不可执行」的显式债务，但维度不同。
#
# 为什么需要它：check_state_reachability 只做「状态图可达性」——只要域转移表里有
# 边，闸门就绿；它不校验「是否有 action 能触发这条边」。于是「项目创建后停在
# DRAFT、平台无法推进到生产态」与「闸门全绿」可以同时成立（审计 P2-1 即此）。
# 本分区把「无入口的转移」显式登记，闸门校验其诚实性（对象已实现、字段完整、
# 且该对象确实仍无状态变更 action——一旦补上入口就必须删条目，否则报「陈旧债务」）。
#
# 写入口径：
# - 只登记 _STATE_MACHINE_SOURCES 里已实现状态机的对象；
# - 每个条目必须给 reason / contract_ref / unblocks_when 三项；
# - 反向完备性（删条目/删文件都绕不过）：状态机有转移边、却没有任何**已实现**的
#   状态变更 action 的对象，必须在这里登记债务，否则闸门报红；
# - 「已补上入口」只认运行时台账 action_implementations.yaml 的 implemented：
#   契约里先登记 PROJECT.STATUS.CHANGE（not_implemented）不算入口已补上；
# - 入口真的实现后必须删条目，否则闸门以「陈旧债务」报红。
transition_entry_gaps:
  Project:
    reason: "action_registry 仅有 PROJECT.CREATE/PROJECT.READ；域转移表 7 条边（DRAFT→ACTIVE→ON_HOLD→ACTIVE、ACTIVE→COMPLETED、DRAFT/ON_HOLD/COMPLETED→ARCHIVED）均无对应状态变更 action 入口，项目无法推进到生产态"
    contract_ref: "contracts/action_registry/action_registry.yaml（Project 仅 CREATE/READ）"
    unblocks_when: "正文 31.6 补登记 PROJECT.STATUS.CHANGE（或等价动作）并实现 service/route/权限/事件/负测；ADR-R12 已明示「需等正文口径，不猜契约」"
  Episode:
    reason: "action_registry 仅有 EPISODE.CREATE/EPISODE.READ；域转移表 3 条边（DRAFT→ACTIVE、DRAFT/ACTIVE→ARCHIVED）均无对应状态变更 action 入口"
    contract_ref: "contracts/action_registry/action_registry.yaml（Episode 仅 CREATE/READ）"
    unblocks_when: "正文 31.6 补登记 EPISODE.STATUS.CHANGE（或等价动作）并实现完整链路；ADR-R12 已明示「需等正文口径，不猜契约」"
