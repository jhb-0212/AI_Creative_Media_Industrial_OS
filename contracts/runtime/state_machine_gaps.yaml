# 契约声明了、但运行时转移表尚未覆盖的状态（显式债务登记）
#
# 为什么需要这个文件：
# - 契约 state_machines.yaml 会列出全部状态（含旁支），但正文可能没有给出旁支的
#   来源边与前置条件。按 31.5「未登记转移一律拒绝」，实现不能凭空造边；于是这些
#   状态在运行时不可达。
# - 不可达本身不是错误，**静默不可达**才是错误。本文件把每个不可达状态连同
#   「卡在什么契约缺口」「什么条件解开」一起登记；闸门 check_state_reachability
#   会双向校验：未登记的不许不可达，登记了却已可达的（陈旧债务）同样报红。
#
# 写入口径：
# - 只登记当前实现了状态机（scripts/contract_check.py:_STATE_MACHINE_SOURCES）的对象；
# - 每个状态必须给 reason / contract_ref / unblocks_when 三项，缺一即契约错误；
# - 解开后要立刻删条目，否则闸门会以「陈旧债务」报红。

gaps:
  ReworkTask:
    REJECTED:
      reason: 7.6 正文只给出 status 枚举（OPEN / IN_PROGRESS / DONE / VERIFYING / CLOSED / REJECTED），
        未绘制进入 REJECTED 的授权边；「谁有权驳回返工」没有口径。该状态合法但当前无授权入口，
        按 31.5 未登记转移一律拒绝——指向它的请求必须被拒绝，不能当作「未实现」放行。
      contract_ref: contracts/state_machines/state_machines.yaml → objects.ReworkTask
      unblocks_when: 所有者补登进入 REJECTED 的授权边（预期来自 VERIFYING，携带 reject_reason
        与驳回人），并给出 owner_action 与前置条件；补齐后写入 transitions 并删除本条目
  AssetVersion:
    REJECTED:
      reason: "契约只写「可进入 REJECTED」，未给来源边与触发前置条件（拒绝需理由与证据）"
      contract_ref: "contracts/state_machines/state_machines.yaml → objects.AssetVersion"
      unblocks_when: "8.5 正文补登记来源边（预期形如 TECHNICAL_QC→REJECTED，携带 reject_reason 与证据引用）"
    QUARANTINED:
      reason: "契约只写「可进入 QUARANTINED」，未给来源边；且注明不得直接转 GOLD，须补齐证据并经授权复核"
      contract_ref: "contracts/state_machines/state_machines.yaml → objects.AssetVersion"
      unblocks_when: "正文补登记隔离来源边（预期来自权利/合规失败路径）与解除隔离的授权动作"
    REWORK:
      reason: "契约只写「可进入 REWORK」，未给来源边与返工准入（谁判返工、返工产物如何版本化）"
      contract_ref: "contracts/state_machines/state_machines.yaml → objects.AssetVersion"
      unblocks_when: "正文补登记返工来源边（预期 HUMAN_REVIEW→REWORK）与返工产物引用规则"
    SUPERSEDED:
      reason: "契约只写「可进入 SUPERSEDED」，未给来源边；版本被谁、在什么动作下取代未定义"
      contract_ref: "contracts/state_machines/state_machines.yaml → objects.AssetVersion"
      unblocks_when: "正文补登记取代来源边（预期 APPROVED→SUPERSEDED，携带新版本引用）"
    ARCHIVED:
      reason: "契约只写「可进入 ARCHIVED」，未给来源边与归档保留期口径"
      contract_ref: "contracts/state_machines/state_machines.yaml → objects.AssetVersion"
      unblocks_when: "正文补登记归档来源边与保留期（与 R06 Outbox 保留期策略对齐）"

# 已实现状态机的「转移无 HTTP 入口」债务（与上面的 gaps 区分语义）：
# - gaps 登记的是「状态在域转移表中不可达」（缺来源边）；
# - transition_entry_gaps 登记的是「状态可达、但没有任何 action 能触发这条转移」
#   （缺状态变更入口）。两者都是「绿着但不可执行」的显式债务，但维度不同。
#
# 为什么需要它：check_state_reachability 只做「状态图可达性」——只要域转移表里有
# 边，闸门就绿；它不校验「是否有 action 能触发这条边」。于是「项目创建后停在
# DRAFT、平台无法推进到生产态」与「闸门全绿」可以同时成立（审计 P2-1 即此）。
#
# 为什么判到**边**而不是对象（A23 升级）：
# 旧判据是对象级——对象有任意一个已实现的状态变更 action 就整对象过关。于是
# 「一个对象四条边，一条有入口、三条没有」会静默通过。ConstraintPack 正是这种
# 形态（DRAFT→ACTIVE 归 LOCK 已实现，三条治理边归 STATUS.CHANGE 未实现）。
# 边级判据的应检集合直接来自边表的 Transition.owner_action，不依赖命名约定，
# 也不依赖任何手写清单。
#
# 结构：对象 → 转移边标签 → 债务详情。
#
# 写入口径：
# - 只登记 _STATE_MACHINE_SOURCES 里已实现状态机的对象；
# - 边标签必须与边表的 ``Transition.label`` 逐字一致（"SOURCE -> TARGET"）；
# - 每条边必须给 reason / contract_ref / unblocks_when 三项；
# - 反向完备性（删条目/删文件都绕不过）：owner_action 未实现的边必须登记；
# - 「已补上入口」只认运行时台账 action_implementations.yaml 的 implemented：
#   契约里先登记动作（not_implemented）不算入口已补上；
# - 入口真的实现后必须删条目，否则闸门以「陈旧债务」报红。
transition_entry_gaps:
  ConstraintPack:
    'ACTIVE -> REVOKED':
      reason: 7.9 要求「REVOKED 立即阻断相关路线」，但阻断的消费者（生成路线选择、
        任务调度）尚未落地；现在实现只能得到一条「能改状态、没人读」的边。撤销依据
        （凭什么撤销）也还没有落点——state_machines 只给了边，没给撤销的授权条件。
      contract_ref: contracts/state_machines/state_machines.yaml → objects.ConstraintPack
      unblocks_when: 生成路线选择（PRODUCTION.ROUTE.SELECT）落地并读取 ACTIVE 约束包时，
        实现 CONSTRAINT.PACK.STATUS.CHANGE 的 REVOKED 分支（携带撤销依据与撤销人），
        并把该边的 owner_action 指向已实现条目后删除本条
    'ACTIVE -> STALE':
      reason: STALE 的触发源是「引用的 PrevizVersion 或上游锁定维度失效」，而 PrevizVersion
        未建模、DAG 依赖也未落地——没有失效源的判定能力，实现出来的只是一个「人手置
        STALE」的开关，无法与 7.9 的「须重新确认」语义对齐。
      contract_ref: contracts/state_machines/state_machines.yaml → objects.ConstraintPack
      unblocks_when: PrevizVersion 建模且 STALE 传播（读 DAG 边 + 有效连续性约束）落地后，
        实现 STATUS.CHANGE 的 STALE 分支（携带失效源引用），并删除本条
    'ACTIVE -> SUPERSEDED':
      reason: 7.9「变更须新建版本并 supersede 旧版本」，但「谁有权取代」没有动作。
        把 supersede 藏进 CONSTRAINT.PACK.CREATE 会让「导入一份新包」顺带撤销一份已生效
        的授权（N-07 修掉的形态）。在此之前，库层的部分唯一索引
        uq_constraint_pack_single_active 会把「新版本锁不上」变成可读的 409，而不是静默的
        双 ACTIVE。
      contract_ref: contracts/state_machines/state_machines.yaml → objects.ConstraintPack
      unblocks_when: 实现 STATUS.CHANGE 的 SUPERSEDED 分支（携带新版本引用），并让
        CONSTRAINT.PACK.LOCK 在同一事务内先取代旧版本；落库后删除本条
