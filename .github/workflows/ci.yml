name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_film_industrial
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (uv sync, 锁文件可复现)
        run: uv sync --frozen --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        # 只检查当前有代码的目录；agents/adapters 仍为占位（仅 .gitkeep），
        # 待其落地 .py 后纳入本步骤，避免 mypy 对空目录报 "no .py files" 而误判失败。
        run: uv run mypy packages services apps workers

      - name: Wait for PostgreSQL
        # GitHub Actions 的 service 容器 health check 不会阻塞主 job 步骤，
        # 需主动等待端口就绪，否则后续 alembic/pytest 会因连接被拒而失败。
        run: |
          for i in $(seq 1 30); do
            if bash -c "</dev/tcp/localhost/5432" 2>/dev/null; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          echo "PostgreSQL not ready after 60s" >&2
          exit 1

      - name: Apply migrations
        # 数据库集成测试依赖真实表结构，必须先建表（全新空库），再跑测试。
        run: uv run alembic upgrade head
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_film_industrial

      - name: Unit & integration tests
        run: uv run pytest tests/unit tests/integration -q
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_film_industrial
          REDIS_URL: redis://localhost:6379/0

      - name: Migrations sync check (alembic check)
        run: uv run alembic check
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_film_industrial

  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Contract consistency check
        run: uv run python scripts/contract_check.py

  permission-negative-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Permission negative tests
        run: uv run pytest tests/permission -q

  # 发布链路的构建闸门：镜像必须能构建、且能真正 import 应用。
  # 这里不推送镜像（推送由发布流程单独授权），只保证「构建可复现且可运行」，
  # 避免镜像问题等到上线才暴露。
  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f infra/docker/Dockerfile.api -t ai-film-api:ci .

      - name: Smoke test imported app inside image
        run: docker run --rm -e APP_ENV=development ai-film-api:ci python -c "import apps.api.main; print('import ok')"

      - name: Smoke test migration entrypoint inside image
        run: docker run --rm ai-film-api:ci alembic --version

      # relay 与 api 同镜像、不同入口命令。镜像漏拷 workers/ 时这一步立刻失败，
      # 不会等到编排起来才发现容器永远重启。
      - name: Smoke test relay entrypoint inside image
        run: docker run --rm ai-film-api:ci python -c "import workers.relay.__main__; print('relay import ok')"
