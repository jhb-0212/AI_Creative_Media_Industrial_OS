# 本地/单机编排（Phase 1 最小闭环）
#
# 设计约束：
# - 启动顺序由依赖条件强制：postgres 健康 → migrate 一次性执行成功 → api 起。
#   迁移失败时 api 不会启动（fail-closed），不会出现「半旧表结构接流量」。
# - 迁移是独立一次性容器，不是 api 的入口脚本：多副本滚动发布时不会并发迁移。
# - 口令全部走环境变量占位（默认值仅供本地开发）；生产由密钥系统注入，
#   镜像与编排文件中不含任何真实口令。
# - redis 暂不作为 api 的 depends_on：应用当前未使用 Redis，把未使用的依赖
#   写进就绪链会让「Redis 抖动」误判为 API 不可用。
# - postgres / redis 用官方镜像名（可移植）；若所在网络无法直连 Docker Hub，
#   需在 Docker 守护进程配置 registry mirror（daemon.json 的 registry-mirrors），
#   不要改成本地私有镜像名，否则编排文件就与 CI / 生产脱节。

name: ai-film-industrial

x-db-env: &db-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_DB: ai_film_industrial
  POSTGRES_APP_USER: app_role
  POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-app_dev_password}

services:
  postgres:
    image: postgres:16
    container_name: ai-film-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ai_film_industrial
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_film_industrial"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: ai-film-redis
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 一次性迁移容器：成功退出（exit 0）才允许 api 启动。
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: ai-film-api:local
    command: ["alembic", "upgrade", "head"]
    environment: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: ai-film-api:local
    environment:
      <<: *db-env
      APP_ENV: ${APP_ENV:-development}
      # 限流后端。容器内走服务名 redis，不是宿主端口。
      REDIS_URL: redis://redis:6379/0
      # 限流阈值可按环境调；默认 120 次/分钟/客户端 IP。
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      # 错误码目录默认关闭。本地联调要开就显式置 true，或配 TOKEN 走请求头。
      ERRORS_CATALOG_PUBLIC: ${ERRORS_CATALOG_PUBLIC:-false}
      ERRORS_CATALOG_TOKEN: ${ERRORS_CATALOG_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    restart: unless-stopped

  # Outbox 事件投递（R06 消费端）。与 api 同一镜像、同一 app_role，
  # 区别只在入口命令：它不起 HTTP，只循环投递。
  # healthcheck 显式关闭：镜像里的探针打 /readyz，本服务没有 HTTP 端口，
  # 不关会让容器永远被标记 unhealthy。
  relay:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: ai-film-api:local
    command: ["python", "-m", "workers.relay"]
    environment:
      <<: *db-env
      APP_ENV: ${APP_ENV:-development}
      OUTBOX_RELAY_INTERVAL_SECONDS: ${OUTBOX_RELAY_INTERVAL_SECONDS:-5}
      OUTBOX_RELAY_BATCH_SIZE: ${OUTBOX_RELAY_BATCH_SIZE:-100}
      # 下游外发。留空 = 不注册处理器，事件保持未投递（积压可见）。
      # 配 URL 必须同时配密钥，否则进程启动即失败（拒绝未签名外发）。
      OUTBOX_WEBHOOK_URL: ${OUTBOX_WEBHOOK_URL:-}
      OUTBOX_WEBHOOK_SECRET: ${OUTBOX_WEBHOOK_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: unless-stopped

  # Outbox 分区维护（R06 保留期）。默认不随栈启动（profile=ops），必须显式触发：
  # 它是 DDL 操作（需要迁移角色），且「删不删旧数据」是运维决策，不能自动化掉。
  #   docker compose --profile ops run --rm outbox-maintenance            # dry-run
  #   docker compose --profile ops run --rm outbox-maintenance --apply
  outbox-maintenance:
    profiles: ["ops"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: ai-film-api:local
    command: ["python", "-m", "workers.outbox_maintenance"]
    environment: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

volumes:
  postgres_data:
  redis_data:
