# 本地/单机编排（Phase 1 最小闭环）
#
# 设计约束：
# - 启动顺序由依赖条件强制：postgres 健康 → migrate 一次性执行成功 → api 起。
#   迁移失败时 api 不会启动（fail-closed），不会出现「半旧表结构接流量」。
# - 迁移是独立一次性容器，不是 api 的入口脚本：多副本滚动发布时不会并发迁移。
# - 口令全部走环境变量占位（默认值仅供本地开发）；生产由密钥系统注入，
#   镜像与编排文件中不含任何真实口令。
# - redis 不作为 api 的 depends_on：限流后端（RateLimiter）确实依赖 Redis，
#   但契约是 **fail-open + 熔断**——Redis 不可用时放行并置 degraded 标记，
#   不阻塞请求。因此它属于「降级依赖」而非「启动依赖」：写进 depends_on 或
#   就绪链，会把一次限流后端抖动升级成「API 不可用」，与降级设计相反。
#   降级语义的权威说明见 docs/runbooks/rate-limit-degradation.md。
# - postgres / redis 用官方镜像名（可移植）；若所在网络无法直连 Docker Hub，
#   需在 Docker 守护进程配置 registry mirror（daemon.json 的 registry-mirrors），
#   不要改成本地私有镜像名，否则编排文件就与 CI / 生产脱节。

name: ai-film-industrial

# 数据库连接参数按「角色」拆分，而不是一个全量 anchor。
#
# 为什么拆（第二轮审查 P1-01 的根因）：此前只有一个 x-db-env，含超级用户
# 口令与全部角色口令，谁 `<<: *db-env` 谁就全拿。identity 进程全文不碰数据库，
# 却因此持有 postgres 超级用户口令；relay 只该用 outbox_relay_role，也拿到了
# 全套业务凭证。进程职责拆开了，凭证面没拆，等于边界只写在文档里。
#
# 现在四份 anchor 各自最小：
#   db-endpoint  仅连接参数（无凭证）
#   db-superuser 超级用户（仅迁移与分区维护这类 DDL 作业可用）
#   db-business  两个业务域角色（api 用）
#   db-relay     事件投递角色（relay 用）
# 新增服务必须在 scripts/boundary_assertions.py 的 PROCESS_ALLOWED_DB_ENV 里
# 登记允许集合，否则 contract-check 直接报红（CRED-1）。
x-db-endpoint: &db-endpoint
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ai_film_industrial

x-db-superuser: &db-superuser
  <<: *db-endpoint
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

# 业务域角色（DATA-1）：project_planning / asset_service 各自独立。
# 显式写在这里，是为了让「哪个进程用哪个角色」在编排层一眼可见，
# 而不是靠 Settings 的开发默认值隐式生效。
x-db-business: &db-business
  <<: *db-endpoint
  POSTGRES_PROJECT_PLANNING_USER: project_planning_role
  POSTGRES_PROJECT_PLANNING_PASSWORD: ${POSTGRES_PROJECT_PLANNING_PASSWORD:-project_planning_dev_password}
  POSTGRES_ASSET_SERVICE_USER: asset_service_role
  POSTGRES_ASSET_SERVICE_PASSWORD: ${POSTGRES_ASSET_SERVICE_PASSWORD:-asset_service_dev_password}
  # R16 三域（迁移 a0b1c2d3e4f5）：生产链 / 预算额度 / 质检治理各自角色。
  # 缺项时 Settings 的默认值与之相同，但显式写出才能让「换了口令的部署」
  # 不必改代码就换得掉，也让 compose 成为部署侧的唯一事实源。
  POSTGRES_PRODUCTION_PLANNING_USER: production_planning_role
  POSTGRES_PRODUCTION_PLANNING_PASSWORD: ${POSTGRES_PRODUCTION_PLANNING_PASSWORD:-production_planning_dev_password}
  POSTGRES_BUDGET_QUOTA_USER: budget_quota_role
  POSTGRES_BUDGET_QUOTA_PASSWORD: ${POSTGRES_BUDGET_QUOTA_PASSWORD:-budget_quota_dev_password}
  POSTGRES_QC_GOVERNANCE_USER: qc_governance_role
  POSTGRES_QC_GOVERNANCE_PASSWORD: ${POSTGRES_QC_GOVERNANCE_PASSWORD:-qc_governance_dev_password}

# Relay 专用角色（F03）：只碰 outbox，不碰业务 schema。
x-db-relay: &db-relay
  <<: *db-endpoint
  POSTGRES_RELAY_USER: outbox_relay_role
  POSTGRES_RELAY_PASSWORD: ${POSTGRES_RELAY_PASSWORD:-relay_dev_password}

services:
  postgres:
    image: postgres:16
    container_name: ai-film-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ai_film_industrial
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_film_industrial"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: ai-film-redis
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 一次性迁移容器：成功退出（exit 0）才允许 api 启动。
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: ai-film-api:local
    command: ["alembic", "upgrade", "head"]
    environment: *db-superuser
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: ai-film-api:local
    environment:
      <<: *db-business
      APP_ENV: ${APP_ENV:-development}
      # 验签公钥（KEYS-1/KEYS-3）：API 只持公钥，**绝不下发私钥**。
      # 未配置时 API 拒绝启动（fail-closed）——这是设计，不是缺陷。
      # 本地开发：make dev-keys 生成密钥对后 export 这两个变量。
      IDENTITY_PUBLIC_KEY_PEM: ${IDENTITY_PUBLIC_KEY_PEM:-}
      # 限流后端。容器内走服务名 redis，不是宿主端口。
      REDIS_URL: redis://redis:6379/0
      # 限流阈值可按环境调；默认 120 次/分钟/客户端 IP。
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      # 错误码目录默认关闭。本地联调要开就显式置 true，或配 TOKEN 走请求头。
      ERRORS_CATALOG_PUBLIC: ${ERRORS_CATALOG_PUBLIC:-false}
      ERRORS_CATALOG_TOKEN: ${ERRORS_CATALOG_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    restart: unless-stopped

  # Outbox 事件投递（R06 消费端）。与 api 同一镜像、**不同角色**：
  # relay 以 outbox_relay_role 连接（只有 outbox 的 SELECT + 列级 UPDATE），
  # 不具备任何业务 schema 权限，也不具备事件业务内容的修改权限。
  # 区别只在入口命令：它不起 HTTP，只循环投递。
  # healthcheck 显式关闭：镜像里的探针打 /readyz，本服务没有 HTTP 端口，
  # 不关会让容器永远被标记 unhealthy。
  relay:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: ai-film-api:local
    command: ["python", "-m", "workers.relay"]
    environment:
      <<: *db-relay
      APP_ENV: ${APP_ENV:-development}
      OUTBOX_RELAY_INTERVAL_SECONDS: ${OUTBOX_RELAY_INTERVAL_SECONDS:-5}
      OUTBOX_RELAY_BATCH_SIZE: ${OUTBOX_RELAY_BATCH_SIZE:-100}
      # 下游外发。留空 = 不注册处理器，事件保持未投递（积压可见）。
      # 配 URL 必须同时配密钥，否则进程启动即失败（拒绝未签名外发）。
      OUTBOX_WEBHOOK_URL: ${OUTBOX_WEBHOOK_URL:-}
      OUTBOX_WEBHOOK_SECRET: ${OUTBOX_WEBHOOK_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: unless-stopped

  # 身份签发进程（KEYS-1 S3 / KEYS-3）：**唯一持有签发私钥**的部署单元，
  # 对外提供 JWKS（公钥分发），不提供 token 签发端点。
  # 与 api 同镜像、不同 entrypoint；两者在进程边界上分开，私钥不出本进程。
  identity:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: ai-film-api:local
    command: ["python", "-m", "workers.identity"]
    environment:
      # 身份进程不连数据库：不注入任何 POSTGRES_*（第二轮审查 P1-01）。
      # 它只持签发私钥并对外提供 JWKS。
      APP_ENV: ${APP_ENV:-development}
      # 私钥只注入这里（生产由密钥系统注入；本地 make dev-keys 生成）。
      IDENTITY_PRIVATE_KEY_PEM: ${IDENTITY_PRIVATE_KEY_PEM:-}
      IDENTITY_PUBLIC_KEY_PEM: ${IDENTITY_PUBLIC_KEY_PEM:-}
      IDENTITY_PORT: ${IDENTITY_PORT:-8100}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # 宿主端口与容器端口都与 IDENTITY_PORT 同源：此前容器端口与健康检查
      # 硬编码 8100，改配置只会让探针打空端口（P2-01）。
      - "${IDENTITY_HOST_PORT:-8100}:${IDENTITY_PORT:-8100}"
    healthcheck:
      # 复用镜像内的 python 探针，避免依赖 curl（runtime 镜像不装它）。
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen(f\"http://127.0.0.1:{os.environ.get('IDENTITY_PORT', '8100')}/health\", timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # Outbox 分区维护（R06 保留期）。常驻模式：每 24 小时补建缺失月份分区，
  # 并把过期分区「导出归档 + DETACH + 改名保留」，每轮结果写 outbox.maintenance_runs。
  # 为什么不默认 --drop-detached：删除是不可逆的容量决策，由运维显式执行一次：
  #   docker compose --profile ops run --rm outbox-maintenance \
  #     python -m workers.outbox_maintenance --apply --archive-dir /archive --drop-detached
  # 单看计划（dry-run）：
  #   docker compose --profile ops run --rm outbox-maintenance \
  #     python -m workers.outbox_maintenance
  outbox-maintenance:
    profiles: ["ops"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: ai-film-api:local
    command:
      [
        "python",
        "-m",
        "workers.outbox_maintenance",
        "--apply",
        "--every-hours",
        "24",
        "--archive-dir",
        "/archive",
      ]
    # 分区维护要建分区 / ATTACH PARTITION，需表属主权限（当前即超级用户）。
    # 这是 DDL 作业的显式例外，与 migrate 同性质，已在 CRED-1 例外清单登记。
    environment: *db-superuser
    volumes:
      # 归档是本机最后一份可校验副本：必须持久化，不能随容器删除而消失。
      - outbox_archive:/archive
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    # 常驻循环自身吞掉单轮异常；只兜进程级崩溃，避免静默停止维护。
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  outbox_archive:
